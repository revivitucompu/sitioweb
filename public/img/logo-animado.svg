<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 2000" role="img" aria-label="Reviví Tu Compu">
  <title>Reviví Tu Compu</title>
  <defs>
    <style>
      .marco path, .linea path, .base path, .celeste { fill: #29abe2; }
      .naranja { fill: #f15a24; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; clip-path: none !important; }
      }
      /* ── entrada rápida (menos de 1 segundo) ── */
      .disco { opacity: 0; transform: scale(.94); transform-origin: 1000px 1000px;
               animation: entrar .34s cubic-bezier(.2,.8,.3,1) forwards; }
      .marco, .base { opacity: 0; transform: scale(.9); transform-origin: 966px 620px;
                      animation: entrar .34s cubic-bezier(.2,.8,.3,1) forwards; }
      .base { animation-delay: .08s; }
      .linea path { fill: url(#brillo); }
      .linea { clip-path: url(#barrido); }
      .cortina { transform-origin: 600px 0; transform: scaleX(0);
                 animation: trazar .5s cubic-bezier(.25,.1,.2,1) .22s forwards; }
      .revivi path, .tucompu path { opacity: 0; transform: translateY(34px);
                 animation: subir .3s cubic-bezier(.2,.8,.3,1) forwards; }
      @keyframes entrar { to { opacity: 1; transform: scale(1); } }
      @keyframes trazar { to { transform: scaleX(1); } }
      @keyframes subir { to { opacity: 1; transform: translateY(0); } }
      .revivi path:nth-child(1) { animation-delay: .46s }
      .revivi path:nth-child(2) { animation-delay: .50s }
      .revivi path:nth-child(3) { animation-delay: .54s }
      .revivi path:nth-child(4) { animation-delay: .58s }
      .revivi path:nth-child(5) { animation-delay: .62s }
      .revivi path:nth-child(6) { animation-delay: .66s }
      .tucompu path:nth-child(1) { animation-delay: .70s }
      .tucompu path:nth-child(2) { animation-delay: .73s }
      .tucompu path:nth-child(3) { animation-delay: .76s }
      .tucompu path:nth-child(4) { animation-delay: .79s }
      .tucompu path:nth-child(5) { animation-delay: .82s }
      .tucompu path:nth-child(6) { animation-delay: .85s }
      .tucompu path:nth-child(7) { animation-delay: .88s }
    </style>
    <clipPath id="barrido"><rect class="cortina" x="600" y="380" width="950" height="400"/></clipPath>
    <linearGradient id="brillo" x1="0" y1="0" x2="1" y2="0" gradientTransform="translate(-1 0)">
      <stop offset="0%" stop-color="#29abe2"/>
      <stop offset="42%" stop-color="#29abe2"/>
      <stop offset="50%" stop-color="#9fe0fa"/>
      <stop offset="58%" stop-color="#29abe2"/>
      <stop offset="100%" stop-color="#29abe2"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0"
        dur="2.6s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

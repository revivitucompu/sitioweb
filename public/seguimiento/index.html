<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E2230">
<title>Seguimiento de tu equipo · Reviví Tu Compu</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #0E2230; --tinta-suave: #5A7183; --fondo: #F4F8FB; --superficie: #FFFFFF; --linea: #D9E6EF;
    --acento: #29AAE3; --acento-oscuro: #1583B5; --acento-fondo: #E3F3FB; --verde: #17865A; --verde-fondo: #E4F3EC;
    --ambar: #B76E0F; --ambar-fondo: #FCF1E1; --rojo: #B42318;
    --fuente: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --titulos: "Archivo Narrow", "Arial Narrow", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--fuente); font-size: 16px; line-height: 1.5; color: var(--tinta); background: var(--fondo); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  a { color: var(--acento-oscuro); }

  header { background: var(--tinta); padding: 14px 18px; padding-top: max(14px, env(safe-area-inset-top)); text-align: center; }
  header a { display: inline-flex; align-items: center; gap: 10px; color: #fff; text-decoration: none; }
  header img { width: 38px; height: 38px; object-fit: contain; }
  header span { font-family: var(--titulos); font-weight: 700; font-size: 1.3rem; }

  main { max-width: 620px; margin: 0 auto; padding: 22px 16px 48px; }
  .saludo { color: var(--tinta-suave); margin: 0 0 4px; }
  h1 { font-family: var(--titulos); font-weight: 700; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1.05; margin: 0 0 4px; }
  .equipo { color: var(--tinta-suave); margin: 0 0 20px; }

  .estado { --c: var(--acento-oscuro); --cf: var(--acento-fondo); background: var(--superficie); border-radius: 14px; padding: 20px 18px; border-top: 5px solid var(--c); margin-bottom: 14px; }
  .estado-etiqueta { display: inline-block; font-size: .8rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--c); background: var(--cf); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  .estado h2 { font-family: var(--titulos); font-size: 1.8rem; line-height: 1.1; margin: 0 0 6px; }
  .estado p { margin: 0; color: var(--tinta-suave); }
  .estado .btn { margin-top: 14px; }

  .pasos { list-style: none; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0; margin: 18px 0 0; }
  .paso { text-align: center; font-size: .78rem; color: var(--tinta-suave); }
  .paso::before { content: ""; display: block; height: 6px; border-radius: 3px; background: var(--linea); margin-bottom: 6px; }
  .paso.hecho::before { background: var(--c); }
  .paso.actual { color: var(--tinta); font-weight: 600; }

  .bloque { background: var(--superficie); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .bloque h3 { font-family: var(--titulos); font-size: 1.3rem; margin: 0 0 12px; }
  dl { margin: 0; display: grid; gap: 10px; }
  dt { font-size: .82rem; color: var(--tinta-suave); }
  dd { margin: 0; white-space: pre-wrap; }

  .linea { list-style: none; margin: 0; padding: 0; }
  .linea li { position: relative; padding: 0 0 16px 28px; }
  .linea li::before { content: ""; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--linea); }
  .linea li:last-child { padding-bottom: 0; }
  .linea li:last-child::before { display: none; }
  .linea .punto { position: absolute; left: 0; top: 4px; width: 16px; height: 16px; border-radius: 50%; background: var(--acento); box-shadow: inset 0 0 0 3px #fff; border: 2px solid var(--acento); }
  .linea strong { display: block; }
  .linea span { color: var(--tinta-suave); font-size: .92rem; }

  .detalle-items { margin-top: 14px; }
  .detalle-items .item { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--fondo); font-size: .96rem; }
  .detalle-items .item:last-child { border-bottom: 0; }
  .detalle-items .item b { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .importe { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 0; border-top: 1px solid var(--fondo); }
  .importe:first-of-type { border-top: 0; padding-top: 0; }
  .importe b { font-family: var(--titulos); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .importe.saldo b { color: var(--rojo); }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; padding: 12px 18px; border-radius: 10px; font-weight: 700; font-size: 1rem; text-decoration: none; border: 0; cursor: pointer; }
  .btn svg { width: 20px; height: 20px; }
  .btn-wa { background: #1DA851; color: #fff; }
  .btn-resena { background: #F5B301; color: #3A2B00; }
  .btn-resena svg { width: 18px; }
  .btn-sec { background: var(--superficie); color: var(--tinta); border: 1.5px solid var(--linea); }

  .aviso { background: var(--superficie); border-radius: 14px; padding: 28px 20px; text-align: center; }
  .aviso h1 { font-size: 1.8rem; }
  .aviso p { color: var(--tinta-suave); }
  .cargando { text-align: center; color: var(--tinta-suave); padding: 60px 0; }
  .pie { text-align: center; font-size: .85rem; color: var(--tinta-suave); margin-top: 22px; }
</style>
</head>
<body>
<header>
  <a href="/"><img src="/img/logo.png" alt=""><span>Reviví Tu Compu</span></a>
</header>

<main id="contenido">
  <p class="cargando">Buscando tu equipo…</p>
</main>

<script src="/taller/config.js"></script>
<script>
const ESTADOS_CLIENTE = {
  'Ingresado': { etiqueta: 'Recibido', titulo: 'Recibí tu equipo', texto: 'Está en la fila para ser revisado. Te aviso apenas tenga el diagnóstico.', c: '#5A7183', cf: '#EDF2F6', paso: 0 },
  'En diagnóstico': { etiqueta: 'En revisión', titulo: 'Estoy revisando tu equipo', texto: 'Estoy buscando la causa de la falla para pasarte un presupuesto.', c: '#1583B5', cf: '#E3F3FB', paso: 1 },
  'Presupuestado': { etiqueta: 'Presupuesto listo', titulo: 'Tu presupuesto está listo', texto: 'Revisalo abajo y confirmame por WhatsApp si querés que avance con la reparación.', c: '#B76E0F', cf: '#FCF1E1', paso: 1, pideRespuesta: true },
  'Esperando repuesto': { etiqueta: 'Esperando repuesto', titulo: 'Esperando un repuesto', texto: 'Apenas llegue el repuesto sigo con la reparación.', c: '#A2541A', cf: '#FCF1E1', paso: 2 },
  'En reparación': { etiqueta: 'En reparación', titulo: 'Estoy reparando tu equipo', texto: 'Te aviso cuando esté listo para retirar.', c: '#1583B5', cf: '#E3F3FB', paso: 2 },
  'En laboratorio: diagnóstico': { etiqueta: 'En laboratorio', titulo: 'Tu equipo está en laboratorio', texto: 'En diagnóstico profundo y realización de presupuesto para la reparación. El plazo habitual es de {min} a {max} días hábiles.', c: '#8A5BC4', cf: '#F1EBF8', paso: 1 },
  'En laboratorio: presupuestado': { etiqueta: 'Presupuesto listo', titulo: 'Tu presupuesto está listo', texto: 'Ya tengo el diagnóstico de laboratorio. Revisá el presupuesto abajo y confirmame por WhatsApp si querés que avance con la reparación.', c: '#A8478F', cf: '#F9EBF4', paso: 1, pideRespuesta: true },
  'En laboratorio: en reparación': { etiqueta: 'En reparación', titulo: 'Tu equipo está en reparación', texto: 'Ya se aprobó el presupuesto y la reparación está en marcha. Te aviso apenas esté listo.', c: '#5E45B0', cf: '#EDEAF8', paso: 2 },
  'En laboratorio externo': { etiqueta: 'En laboratorio', titulo: 'Tu equipo está en laboratorio', texto: 'En diagnóstico profundo y realización de presupuesto para la reparación. El plazo habitual es de {min} a {max} días hábiles.', c: '#8A5BC4', cf: '#F1EBF8', paso: 1 },
  'Sin reparación': { etiqueta: 'Sin reparación', titulo: 'Tu equipo no tiene reparación', texto: 'Te paso el detalle por WhatsApp. El diagnóstico no tiene costo y podés pasar a retirarlo {horario}. Avisame antes de venir.', c: '#C1471A', cf: '#FEF1EA', paso: 3 },
  'Listo para retirar': { etiqueta: 'Listo', titulo: '¡Tu equipo está listo!', texto: 'Podés pasar a retirarlo {horario}. Avisame antes de venir. El plazo para retirarlo es de 90 días desde el aviso.', c: '#17865A', cf: '#E4F3EC', paso: 3 },
  'Entregado': { etiqueta: 'Entregado', titulo: 'Equipo entregado', texto: 'Gracias por confiar en mí.', c: '#0E2230', cf: '#EDF2F6', paso: 4 },
  'Devuelto sin reparar': { etiqueta: 'Entregado', titulo: 'Equipo entregado', texto: 'Gracias por confiar en mí.', c: '#0E2230', cf: '#EDF2F6', paso: 4 }
};
const PASOS = ['Recibido', 'Revisión', 'Reparación', 'Listo', 'Entregado'];
// Detalle del presupuesto, tal como lo cargó el taller
function itemsDe(o) {
  try {
    const l = JSON.parse((o && o.items) || '[]');
    return Array.isArray(l) ? l.map((x) => ({ d: String(x.d || ''), c: Number(x.c) || 1, p: Number(x.p) || 0 })).filter((x) => x.d) : [];
  } catch (e) { return []; }
}
const ESTRELLA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.45l-5.81 3.05 1.11-6.47-4.7-4.58 6.5-.95L12 2.6z"/></svg>';
const WA_ICONO = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3a.5.5 0 0 0 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.1.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>';

const $c = document.getElementById('contenido');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const pesos = (n) => '$' + Math.round(n || 0).toLocaleString('es-AR');
const cfg = typeof CONFIG !== 'undefined' ? CONFIG : {};
function fechaDe(t) {
  const m = String(t || '').match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}):(\d{2}))?/);
  return m ? new Date(+m[3], +m[2] - 1, +m[1], +(m[4] || 0), +(m[5] || 0)) : null;
}
const labDias = Array.isArray(cfg.laboratorioDias) ? cfg.laboratorioDias : [5, 10];

function numeroNegocio() {
  let d = String(cfg.whatsapp || '').replace(/\D/g, '');
  return d;
}
function linkWa(texto) {
  return `https://wa.me/${numeroNegocio()}?text=${encodeURIComponent(texto)}`;
}

function mostrarAviso(titulo, texto) {
  $c.innerHTML = `<div class="aviso"><h1>${esc(titulo)}</h1><p>${esc(texto)}</p>
    <a class="btn btn-wa" href="${linkWa('Hola, quería consultar por el estado de mi equipo.')}" target="_blank" rel="noopener">${WA_ICONO} Escribime por WhatsApp</a></div>`;
}

/* A veces Google pierde el contenido del pedido y responde con la página de prueba
   en vez de los datos: en ese caso se reintenta solo. */
async function consultar(codigo, intentos = 3) {
  let ultimo;
  for (let i = 0; i < intentos; i++) {
    const ctrl = new AbortController();
    const reloj = setTimeout(() => ctrl.abort(), 30000);
    let texto;
    try {
      const res = await fetch(cfg.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ accion: 'seguimiento', codigo }),
        signal: ctrl.signal,
        redirect: 'follow',
        cache: 'no-store'
      });
      texto = await res.text();
    } finally {
      clearTimeout(reloj);
    }
    try {
      return JSON.parse(texto);
    } catch (e) {
      ultimo = e;
      await new Promise((r) => setTimeout(r, 600 * (i + 1)));
    }
  }
  throw ultimo;
}

async function cargar() {
  const codigo = new URLSearchParams(location.search).get('c') || location.hash.replace('#', '');
  if (!codigo) return mostrarAviso('Falta el código', 'Abrí el link completo que te mandé por WhatsApp.');
  if (!cfg.API_URL) return mostrarAviso('No se pudo cargar la información', 'Probá de nuevo en unos minutos.');
  try {
    const data = await consultar(codigo);
    if (!data.ok) {
      if (data.error === 'NO_ENCONTRADO') return mostrarAviso('No encontré este seguimiento', 'El link no es válido o fue reemplazado por uno nuevo. Escribime y te paso el actual.');
      return mostrarAviso('No se pudo cargar la información', data.error || 'Probá de nuevo en unos minutos.');
    }
    pintar(data.orden);
  } catch (e) {
    mostrarAviso('No se pudo cargar la información', 'Revisá tu conexión y volvé a abrir el link.');
  }
}

function pintar(o) {
  let info = ESTADOS_CLIENTE[o.estado] || ESTADOS_CLIENTE['Ingresado'];
  // Si ya respondió el presupuesto, no tiene sentido seguir pidiéndole que confirme
  if (o.respuesta_presupuesto === 'Aceptado' && info.pideRespuesta) {
    info = { ...info, etiqueta: 'Aprobado', titulo: 'Recibí tu confirmación', texto: 'Ya me pongo con la reparación. Te aviso cuando esté listo.', pideRespuesta: false, c: '#17865A', cf: '#E4F3EC' };
  } else if (o.respuesta_presupuesto === 'Rechazado' && info.pideRespuesta) {
    info = { ...info, etiqueta: 'Sin avanzar', titulo: 'Quedamos en no avanzar', texto: 'No se hace la reparación. Escribime y coordinamos el retiro de tu equipo.', pideRespuesta: false, c: '#5A7183', cf: '#EDF2F6' };
  }
  const equipo = [o.tipo, o.marca, o.modelo].filter(Boolean).join(' ');
  const texto = info.texto.replace('{min}', labDias[0]).replace('{max}', labDias[1]).replace('{horario}', cfg.horario || '');
  document.title = `${o.numero} · Seguimiento · Reviví Tu Compu`;

  const pasoActual = info.paso;
  const pasos = PASOS.map((p, i) => `<li class="paso ${i <= pasoActual ? 'hecho' : ''} ${i === pasoActual ? 'actual' : ''}">${p}</li>`).join('');

  // Historial: solo los pasos que ya ocurrieron, ordenados por cuándo pasaron
  const final = o.estado === 'Entregado' || o.estado === 'Devuelto sin reparar';   // el segundo es de órdenes viejas
  const eventos = [
    ['Recibí tu equipo', o.fecha_ingreso],
    ['Ingresó a laboratorio', o.fecha_lab_envio],
    ['Diagnosticado y presupuestado', o.fecha_presupuesto],
    [o.respuesta_presupuesto === 'Rechazado' ? 'No avanzamos con la reparación' : 'Aprobaste el presupuesto',
      o.respuesta_presupuesto ? o.fecha_respuesta : ''],
    ['Retirado de laboratorio', o.fecha_lab_retiro],
    [o.estado === 'Sin reparación' ? 'Diagnóstico: sin reparación' : 'Listo para retirar', o.fecha_listo],
    [o.estado === 'Entregado' ? 'Te lo entregué' : 'Te lo devolví', final ? o.fecha_entrega : '']
  ]
    .filter(([, f]) => f)
    .map(([t, f], i) => { const d = fechaDe(f); return { t, f, i, ms: d ? d.getTime() : Infinity }; })
    .sort((a, b) => a.ms - b.ms || a.i - b.i)
    .map(({ t, f }) => [t, f]);

  const dato = (t, v) => v ? `<div><dt>${t}</dt><dd>${esc(v)}</dd></div>` : '';
  const mensajeRespuesta = `Hola, soy ${o.nombre}. Te escribo por la orden ${o.numero} (${equipo}).`;

  $c.innerHTML = `
    <p class="saludo">Hola${o.nombre ? ' ' + esc(o.nombre) : ''}, este es el seguimiento de tu equipo</p>
    <h1>Orden ${esc(o.numero)}</h1>
    <p class="equipo">${esc(equipo)}</p>

    <section class="estado" style="--c:${info.c};--cf:${info.cf}">
      <span class="estado-etiqueta">${esc(info.etiqueta)}</span>
      <h2>${esc(info.titulo)}</h2>
      <p>${esc(texto)}</p>
      ${o.estado === 'Entregado' && o.garantia_hasta ? `<p style="margin-top:8px">La mano de obra tiene garantía hasta el <strong>${esc(o.garantia_hasta)}</strong>.</p>` : ''}
      ${info.pideRespuesta ? `<a class="btn btn-wa" href="${linkWa(mensajeRespuesta + ' Quiero avanzar con la reparación.')}" target="_blank" rel="noopener">${WA_ICONO} Confirmar por WhatsApp</a>` : ''}
      ${o.estado === 'Entregado' && cfg.linkResenas ? `<a class="btn btn-resena" href="${esc(cfg.linkResenas)}" target="_blank" rel="noopener">${ESTRELLA} Dejar una reseña en Google</a>` : ''}
      <ol class="pasos" style="grid-template-columns:repeat(${PASOS.length},1fr)">${pasos}</ol>
    </section>

    ${(o.diagnostico || o.trabajo_realizado || o.total || itemsDe(o).length) ? `
    <section class="bloque">
      <h3>${o.estado === 'Entregado' ? 'Trabajo realizado' : 'Diagnóstico y presupuesto'}</h3>
      <dl>${dato('Diagnóstico', o.diagnostico)}${dato('Trabajo realizado', o.trabajo_realizado)}</dl>
      ${itemsDe(o).length ? `<div class="detalle-items">
        ${itemsDe(o).map((x) => `<div class="item"><span>${x.c > 1 ? esc(String(x.c)) + ' × ' : ''}${esc(x.d)}</span><b>${pesos(x.c * x.p)}</b></div>`).join('')}
      </div>` : ''}
      ${o.total ? `<div style="margin-top:${o.diagnostico || o.trabajo_realizado || itemsDe(o).length ? '14px' : '0'}">
        <div class="importe"><span>Total</span><b>${pesos(o.total)}</b></div>
        ${o.saldo && o.saldo !== o.total ? `<div class="importe saldo"><span>Saldo a abonar</span><b>${pesos(o.saldo)}</b></div>` : ''}
        ${!o.saldo ? '<div class="importe"><span>Estado del pago</span><span>Abonado</span></div>' : ''}
      </div>` : ''}
    </section>` : ''}

    <section class="bloque">
      <h3>Historial</h3>
      <ul class="linea">${eventos.map(([t, f]) => `<li><span class="punto" aria-hidden="true"></span><strong>${esc(t)}</strong><span>${esc(f)}</span></li>`).join('')}</ul>
    </section>

    <section class="bloque">
      <h3>Tu equipo</h3>
      <dl>
        ${dato('Equipo', equipo)}
        ${dato('N° de serie', o.serie)}
        ${dato('Falla que me contaste', o.falla)}
        ${dato('Lo que dejaste con el equipo', o.accesorios)}
        ${dato('Cómo llegó', o.estado_ingreso)}
      </dl>
    </section>

    <a class="btn btn-wa" href="${linkWa(mensajeRespuesta)}" target="_blank" rel="noopener">${WA_ICONO} Consultar por WhatsApp</a>
    ${o.estado === 'Entregado' && cfg.linkResenas ? `<p style="text-align:center;margin:14px 0 0;color:var(--tinta-suave)">¿Quedaste conforme? Una reseña me ayuda muchísimo.</p>` : ''}
    <p class="pie">Última actualización: ${esc(o.actualizado || o.fecha_ingreso)}<br>Esta página es personal: compartila solo con quien quieras.<br><a href="/terminos">Términos y condiciones del servicio</a></p>`;
}

cargar();
</script>
</body>
</html>

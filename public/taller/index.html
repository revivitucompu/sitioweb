<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E2230">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/taller/taller.webmanifest">
<link rel="preload" as="image" href="/img/logo-app.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taller">
<title>Taller · Reviví Tu Compu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #0E2230;
    --tinta-suave: #5A7183;
    --fondo: #F4F8FB;
    --superficie: #FFFFFF;
    --linea: #D9E6EF;
    --acento: #29AAE3;
    --acento-oscuro: #1583B5;
    --acento-fondo: #E3F3FB;
    --alerta: #C1471A;
    --alerta-fondo: #FEF1EA;
    --error: #B42318;
    --radio: 10px;
    --nav-alto: 60px;
    --fuente: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --titulos: "Archivo Narrow", "Arial Narrow", sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--fuente); font-size: 16px; line-height: 1.45;
    color: var(--tinta); background: var(--fondo); -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--acento-oscuro); }
  :focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
  svg { flex: none; }

  /* ── Login ── */
  .login { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 28px 18px; background: var(--tinta); }
  .login-logo { text-align: center; }
  .login-logo img { display: block; width: 168px; height: 168px; margin: 0 auto; filter: drop-shadow(0 10px 28px rgba(0,0,0,.35)); }
  .login-logo span { display: block; margin-top: 14px; color: #9FB6C6; font-size: .95rem; letter-spacing: .02em; }
  .login .login-caja form { margin-top: 0; }
  @media (max-height: 640px) { .login-logo img { width: 120px; height: 120px; } .login { gap: 16px; } }
  .inicio { display: grid; justify-items: center; gap: 16px; padding: 70px 0; color: var(--tinta-suave); }
  .inicio img { width: 128px; height: 128px; filter: drop-shadow(0 8px 22px rgba(14,34,48,.16)); }
  @media (prefers-reduced-motion: no-preference) {
    .login-logo img { animation: logoEntra .55s cubic-bezier(.2,.8,.25,1) both; }
    .login-caja { animation: cajaEntra .5s .12s ease-out both; }
    .inicio img { animation: latido 1.6s ease-in-out infinite; }
    @keyframes logoEntra { from { opacity: 0; transform: scale(.86); } to { opacity: 1; transform: none; } }
    @keyframes cajaEntra { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  }
  .login-caja { width: 100%; max-width: 380px; background: var(--superficie); border-radius: 16px; padding: 28px 22px 24px; }
  #botonGoogle { display: flex; justify-content: center; min-height: 44px; }
  .login-separador { display: flex; align-items: center; gap: 12px; margin: 20px 0 18px; color: var(--tinta-suave); font-size: .82rem; }
  .login-separador::before, .login-separador::after { content: ''; flex: 1; height: 1px; background: var(--linea); }
  .marca { font-family: var(--titulos); font-weight: 700; font-size: 1.9rem; line-height: 1; letter-spacing: -0.01em; margin: 0 0 4px; }
  .marca span { display: block; font-size: 1rem; font-weight: 500; font-family: var(--fuente); color: var(--tinta-suave); margin-top: 6px; letter-spacing: 0; }
  .login form { margin-top: 22px; display: grid; gap: 14px; }

  /* ── Barra superior y navegación ── */
  .barra {
    position: sticky; top: 0; z-index: 20; background: var(--tinta); color: #fff;
    padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
    display: flex; align-items: center; gap: 10px;
  }
  .barra .marca { font-size: 1.25rem; color: #fff; margin: 0 auto 0 0; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .btn-barra {
    background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; border-radius: 8px;
    min-height: 40px; min-width: 40px; padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .btn-barra svg { width: 18px; height: 18px; }
  .btn-barra.girando svg { animation: girar 0.8s linear infinite; }
  .estado-cola {
    display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 12px; border-radius: 999px;
    border: 0; font-size: .85rem; font-weight: 600; white-space: nowrap; background: rgba(255,255,255,.12); color: #fff; cursor: default;
  }
  .estado-cola::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: girar .8s linear infinite; }
  .estado-cola.error { background: var(--error); cursor: pointer; }
  .estado-cola.actualizando { background: rgba(255,255,255,.08); font-weight: 500; }
  .estado-cola.error::before { content: "!"; border: 0; animation: none; width: auto; height: auto; font-weight: 700; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--superficie); border-top: 1px solid var(--linea);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    height: var(--nav-alto); font-size: .75rem; font-weight: 600; color: var(--tinta-suave); text-decoration: none;
  }
  .nav svg { width: 22px; height: 22px; }
  @media (max-width: 380px) { .nav a { font-size: .68rem; } }
  .nav a[aria-current=page] { color: var(--acento-oscuro); }

  @media (min-width: 900px) {
    .barra { padding: 10px 28px; }
    .barra .marca { margin-right: 18px; }
    .nav { position: static; display: flex; gap: 4px; background: transparent; border: 0; padding: 0; margin-right: auto; }
    .nav a { flex-direction: row; gap: 8px; height: 40px; padding: 0 12px; border-radius: 8px; font-size: .95rem; color: #C5D0D5; }
    .nav svg { width: 18px; height: 18px; }
    .nav a[aria-current=page] { background: rgba(255,255,255,.12); color: #fff; }
    .barra .marca { margin: 0 18px 0 0; }
  }

  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px calc(var(--nav-alto) + 110px); }
  @media (min-width: 900px) { main { padding: 28px 28px 120px; } }
  .angosto { max-width: 680px; }

  h1 { font-family: var(--titulos); font-weight: 700; font-size: 2.2rem; line-height: 1.05; margin: 0 0 6px; }
  .bajada { margin: 0 0 20px; color: var(--tinta-suave); }
  .cab-vista { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 16px; margin-bottom: 18px; }
  .cab-vista .bajada { margin: 0; }
  .volver { display: inline-flex; align-items: center; gap: 4px; margin-bottom: 10px; font-weight: 600; text-decoration: none; min-height: 40px; }
  .volver svg { width: 18px; height: 18px; }

  /* ── Bloques y paneles ── */
  .bloque { background: var(--superficie); border-radius: var(--radio); padding: 20px 18px; margin-bottom: 14px; border-left: 4px solid var(--acento); }
  .bloque.revision { border-left-color: var(--alerta); }
  .bloque.neutro { border-left-color: var(--linea); }
  .bloque h2, .panel h2 { font-family: var(--titulos); font-size: 1.3rem; font-weight: 700; margin: 0 0 14px; }
  .nota { font-size: .9rem; color: var(--tinta-suave); margin: -8px 0 14px; }

  /* ── La orden: ficha al costado y bloques que se abren de a uno ── */
  .orden-grilla { display: grid; gap: 14px; align-items: start; }
  @media (min-width: 1000px) {
    .orden-grilla { grid-template-columns: 330px minmax(0, 1fr); gap: 18px; }
    .ficha { position: sticky; top: 14px; }
  }
  .ficha { background: var(--superficie); border-radius: var(--radio); padding: 18px 16px; border-left: 4px solid var(--c, var(--acento)); }
  .ficha .ot-num { margin: 0; }
  .ficha-ingreso { font-size: .85rem; color: var(--tinta-suave); margin: 2px 0 14px; }
  .ficha-estado .campo { margin-bottom: 0; }
  .ficha .aviso-vencida { margin: 12px 0 0; }
  .ficha-datos { display: grid; margin: 6px 0 0; }
  .ff { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 11px; align-items: start; padding: 11px 0; border-top: 1px solid var(--linea); }
  .ff-acciones { display: flex; gap: 6px; }
  .ico-btn { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; flex: none;
    border: 1.5px solid var(--linea); border-radius: 9px; background: var(--superficie); color: var(--tinta-suave); cursor: pointer; padding: 0; }
  .ico-btn svg { width: 19px; height: 19px; }
  .ico-btn:hover { border-color: var(--acento); color: var(--acento-oscuro); }
  .ff > svg { width: 19px; height: 19px; color: var(--tinta-suave); margin-top: 2px; }
  .ff span { display: block; font-size: .76rem; color: var(--tinta-suave); }
  .ff b { font-weight: 600; word-break: break-word; }
  .ff b a { color: inherit; }
  .ff small { display: block; font-weight: 400; color: var(--tinta-suave); font-size: .84rem; }
  .ficha-acciones { display: grid; gap: 8px; margin-top: 16px; }
  .ficha-acciones .btn { width: 100%; }
  .ficha-ayuda { margin: 10px 0 0; }

  .plega { background: var(--superficie); border-radius: var(--radio); margin-bottom: 10px; border-left: 4px solid var(--linea); }
  .plega.abierto { border-left-color: var(--acento); }
  .plega-cab { position: relative; width: 100%; display: grid; grid-template-columns: 24px minmax(0, 1fr) 22px; align-items: center; gap: 13px;
    padding: 14px 16px; text-align: left; min-height: 62px; }
  .plega-abrir { position: absolute; inset: 0; width: 100%; background: transparent; border: 0; border-radius: var(--radio); padding: 0; cursor: pointer; }
  .plega-abrir:focus-visible { outline: 2px solid var(--acento); outline-offset: -3px; }
  /* El contenido deja pasar el clic al botón de atrás; la ayuda es la excepción */
  .plega-cab > *:not(.plega-abrir) { pointer-events: none; }
  .plega-cab .tip-caja { pointer-events: auto; }
  .plega-nombre { display: flex; align-items: center; min-width: 0; }
  .plega-nombre b { flex: 0 1 auto; }
  .plega-ico, .plega-flecha { display: flex; color: var(--tinta-suave); }
  .plega-ico svg { width: 21px; height: 21px; }
  .plega-flecha svg { width: 20px; height: 20px; transition: transform .18s; }
  .plega.abierto .plega-ico { color: var(--acento-oscuro); }
  .plega.abierto .plega-flecha svg { transform: rotate(180deg); }
  .plega-tit b { display: block; font-family: var(--titulos); font-size: 1.2rem; font-weight: 700; }
  .plega-cab .tip { margin-left: 9px; }
  .plega-res { display: block; font-size: .86rem; color: var(--tinta-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  .plega.abierto .plega-res { display: none; }
  .plega-cuerpo { display: none; padding: 2px 16px 18px; }
  .plega.abierto .plega-cuerpo { display: block; }
  .plega .edicion { display: none; }
  .plega.editando .edicion { display: block; }
  .plega.editando .lectura { display: none; }
  .dato { display: grid; gap: 2px; width: 100%; text-align: left; background: transparent; border: 0; border-top: 1px solid var(--linea);
    padding: 10px 2px; cursor: pointer; color: inherit; font: inherit; }
  .datos .dato:first-child { border-top: 0; padding-top: 2px; }
  .dato > span { font-size: .78rem; color: var(--tinta-suave); }
  .dato > b { font-weight: 600; white-space: pre-line; }
  .dato.sin > b { font-weight: 400; color: var(--tinta-suave); }
  .dato:hover > b { color: var(--acento-oscuro); }
  .zona-riesgo { margin-top: 26px; padding: 16px; border: 1.5px dashed var(--linea); border-radius: var(--radio); }
  .btn-riesgo { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--linea); background: var(--superficie);
    border-radius: 8px; padding: 10px 15px; min-height: 44px; font: inherit; font-weight: 600; color: var(--tinta-suave); cursor: pointer; }
  .btn-riesgo svg { width: 17px; height: 17px; }
  .btn-riesgo:hover:not(:disabled) { border-color: var(--error); color: var(--error); background: #FEF2F1; }
  .zona-riesgo.confirmando { border-style: solid; border-color: var(--error); background: #FEF2F1; }
  .riesgo-aviso { margin: 0 0 14px; }
  .riesgo-aviso b { display: block; font-family: var(--titulos); font-size: 1.15rem; margin-bottom: 6px; color: var(--error); }
  .riesgo-aviso span { display: block; font-size: .92rem; }
  .btn-confirmar { background: var(--error); border-color: var(--error); color: #fff; }
  .btn-confirmar:hover:not(:disabled) { background: #8E1C13; border-color: #8E1C13; color: #fff; }

  .btn-editar { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; border: 1.5px solid var(--linea); background: var(--superficie);
    border-radius: 8px; padding: 9px 14px; min-height: 42px; font-weight: 600; font-size: .9rem; color: var(--tinta); cursor: pointer; }
  .btn-editar svg { width: 16px; height: 16px; }
  .btn-editar:hover { border-color: var(--acento); color: var(--acento-oscuro); }

  /* ── Ayudas: el texto aparece al tocar el signo de pregunta ── */
  .tip-caja { position: relative; display: inline-flex; vertical-align: middle; }
  .tip { position: relative; width: 24px; height: 24px; flex: none; margin-left: 7px; padding: 0; border-radius: 50%;
    border: 1.5px solid var(--linea); background: var(--superficie); color: var(--tinta-suave);
    font: 700 .8rem/1 var(--fuente); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .tip::after { content: ''; position: absolute; inset: -10px; }
  .tip:hover, .tip[aria-expanded="true"] { border-color: var(--acento); color: var(--acento-oscuro); background: var(--acento-fondo); }
  .tip-txt { position: absolute; z-index: 60; top: 32px; left: 0; width: min(330px, 74vw); background: var(--tinta); color: #F2F8FC;
    padding: 13px 15px; border-radius: 10px; font-size: .85rem; font-weight: 400; line-height: 1.5; text-align: left;
    box-shadow: 0 12px 30px rgba(14, 34, 48, .26); }
  .tip-txt b { color: #fff; }
  .tip-txt a { color: #9FDCF8; }
  .tip-txt code { background: rgba(255, 255, 255, .14); padding: 1px 5px; border-radius: 4px; }
  .tip-derecha .tip-txt { left: auto; right: 0; }

  .panel { background: var(--superficie); border-radius: var(--radio); padding: 18px; }
  .panel-cab { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .panel-cab h2 { margin: 0; }

  .grilla-tablero { display: grid; gap: 14px; }
  .grilla-tablero > *, .lista > * { min-width: 0; }
  @media (min-width: 900px) {
    /* Filas finas: cada bloque ocupa las que necesita y no quedan huecos entre uno y otro */
    .grilla-tablero { grid-template-columns: 1fr 1fr; grid-auto-rows: 8px; align-items: start; }
    .grilla-tablero .ancho { grid-column: 1 / -1; }
  }

  /* ── Personalizar el tablero ── */
  .ayuda-personalizar { margin: 0 0 12px; }
  .bloque-barra { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--linea); }
  .bloque-barra b { font-size: .88rem; color: var(--tinta-suave); }
  .bloque-acciones { display: flex; gap: 6px; }
  .bloque-acciones button { border: 1.5px solid var(--linea); background: var(--superficie); border-radius: 8px;
    padding: 5px 9px; font: inherit; font-size: .85rem; font-weight: 600; color: var(--tinta); cursor: pointer; display: inline-flex; align-items: center; }
  .bloque-acciones button:hover:not(:disabled) { border-color: var(--acento); color: var(--acento-oscuro); }
  .bloque-acciones button:disabled { opacity: .35; cursor: default; }
  .bloque-acciones svg { width: 16px; height: 16px; }
  .grilla-tablero.editando .bloque-tablero { outline: 2px dashed var(--linea); outline-offset: 3px; border-radius: var(--radio); }
  .grilla-tablero.editando .bloque-tablero:not(.panel) { background: var(--superficie); padding: 14px; }
  .chip-bloque { border: 1.5px solid var(--linea); background: var(--superficie); border-radius: 999px;
    padding: 7px 14px; font: inherit; font-size: .92rem; color: var(--tinta); cursor: pointer; }
  .chip-bloque:hover { border-color: var(--acento); }
  .chip-bloque span { color: var(--acento-oscuro); font-weight: 700; margin-left: 2px; }

  /* ── Campos ── */
  .campo { display: grid; gap: 6px; margin-bottom: 14px; }
  .campo:last-child { margin-bottom: 0; }
  .campo label, .etiqueta { font-weight: 600; font-size: .95rem; }
  .opcional { font-weight: 400; color: var(--tinta-suave); }
  .ayuda { font-size: .85rem; color: var(--tinta-suave); }
  .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  @media (max-width: 420px) { .fila { grid-template-columns: 1fr; } }
  .fila .campo:last-child { margin-bottom: 14px; }
  .bloque > .fila:last-child .campo { margin-bottom: 0; }
  @media (max-width: 420px) { .bloque > .fila:last-child .campo:not(:last-child) { margin-bottom: 14px; } }

  input[type=text], input[type=tel], input[type=email], input[type=password], input[type=date], input[type=search], select, textarea {
    width: 100%; min-height: 48px; padding: 11px 12px; font-size: 16px;
    border: 1.5px solid var(--linea); border-radius: 8px; background: #fff; appearance: none; -webkit-appearance: none;
  }
  select {
    background-image: linear-gradient(45deg, transparent 50%, var(--tinta-suave) 50%), linear-gradient(135deg, var(--tinta-suave) 50%, transparent 50%);
    background-position: calc(100% - 20px) 21px, calc(100% - 14px) 21px; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 36px;
  }
  textarea { min-height: 92px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--acento); outline: none; box-shadow: 0 0 0 3px rgba(41,170,227,.22); }

  .foto-estado { margin: 10px 0 0; }
  .foto-estado.mal { color: var(--error); }

  /* Importe con el signo adentro del recuadro */
  .con-signo { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center;
    border: 1.5px solid var(--linea); border-radius: 8px; background: #fff; min-height: 48px; }
  .con-signo > span { padding-left: 12px; color: var(--tinta-suave); font-weight: 600; }
  .con-signo input { border: 0 !important; box-shadow: none !important; padding-left: 4px; background: transparent; }
  .con-signo:focus-within { border-color: var(--acento); box-shadow: 0 0 0 3px rgba(41,170,227,.22); }

  /* Deslizador de porcentaje */
  .deslizador { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; }
  .deslizador input[type=range] { width: 100%; height: 34px; margin: 0; background: transparent; appearance: none; -webkit-appearance: none; cursor: pointer; }
  .deslizador input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--linea); }
  .deslizador input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--linea); }
  .deslizador input[type=range]::-webkit-slider-thumb { appearance: none; -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px;
    border-radius: 50%; background: var(--acento); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(14,34,48,.3); }
  .deslizador input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--acento); border: 3px solid #fff; }
  .deslizador input[type=range]:focus { outline: none; }
  .deslizador input[type=range]:focus::-webkit-slider-thumb { box-shadow: 0 0 0 4px rgba(41,170,227,.3); }
  .deslizador-valor { min-width: 68px; text-align: right; font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .deslizador-topes { display: flex; justify-content: space-between; font-size: .78rem; color: var(--tinta-suave); margin-top: -2px; }

  .tel-wrap { display: grid; grid-template-columns: 118px 1fr; gap: 8px; }
  .tel-wrap select { padding-left: 10px; padding-right: 28px; background-position: calc(100% - 16px) 21px, calc(100% - 10px) 21px; }
  .clave-wrap { position: relative; }
  .clave-wrap input { padding-right: 84px; }

  /* ── Botones ── */

  /* ── Tablero ── */

    padding: 12px 16px; text-decoration: none; color: var(--tinta); border-left: 4px solid var(--c);
  }

  .pendiente small { display: block; font-weight: 400; color: var(--tinta-suave); }

  .mes-nav { display: flex; align-items: center; gap: 4px; }

  .mes-nav svg { width: 18px; height: 18px; }
  .mes-nombre { font-weight: 700; min-width: 8.5em; text-align: center; white-space: nowrap; }
  .cifras { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--fondo); border: 1px solid var(--fondo); border-radius: 8px; overflow: hidden; }
  @media (min-width: 560px) { .cifras.cuatro { grid-template-columns: repeat(4, 1fr); } }
  .cifra { background: var(--superficie); padding: 12px; display: grid; gap: 2px; }

  .recurrentes { list-style: none; padding: 0; margin: 14px 0 0; }

  /* ── Asistencia remota ── */
  .valor-hora { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .valor-hora strong { display: block; font-family: var(--titulos); font-size: 1.9rem; line-height: 1.1; }
  .lapso { display: grid; grid-template-columns: 1fr 1fr 70px 44px; gap: 8px; align-items: end; padding: 12px 0; border-top: 1px solid var(--fondo); }

  /* Servicios y hardware */
  .tabla-cat { background: var(--superficie); border-radius: var(--radio); padding: 12px; }
  .cat-cab { display: grid; grid-template-columns: 1.4fr 96px 120px 1.2fr 84px; gap: 8px; padding: 0 4px 8px; font-size: .82rem; color: var(--tinta-suave); font-weight: 600; }

  .cat-fila input, .cat-fila select { padding: 9px 10px; border: 1.5px solid var(--linea); border-radius: 8px; font: inherit; font-size: .95rem; background: #fff; min-width: 0; }
  .cat-fila input:focus, .cat-fila select:focus { outline: 2px solid var(--acento); outline-offset: 1px; border-color: var(--acento); }

  .cat-acciones { display: flex; gap: 6px; justify-content: flex-end; }
  .cat-btn { width: 38px; height: 38px; border: 1.5px solid var(--linea); border-radius: 8px; background: #fff; color: var(--tinta-suave); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 1.2rem; line-height: 1; }

  /* Ítems del presupuesto */
  .item-fila { display: grid; grid-template-columns: 1fr 108px 120px 110px 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .item-fila input { padding: 10px 11px; border: 1.5px solid var(--linea); border-radius: 8px; font: inherit; background: #fff; min-width: 0; }

  .item-fila .item-p { text-align: right; }

    border: 1.5px solid var(--linea); border-radius: 8px; background: #fff; overflow: hidden; height: 42px; }

    color: var(--tinta-suave); cursor: pointer; padding: 0; }

  .cantidad input { border: 0 !important; outline: 0 !important; text-align: center; padding: 0 !important; font-variant-numeric: tabular-nums; font-weight: 600; }
  .item-sub { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item-quitar { width: 40px; height: 42px; border: 1.5px solid var(--linea); border-radius: 8px; background: #fff; font-size: 1.3rem; line-height: 1; color: var(--tinta-suave); cursor: pointer; }

  @media (max-width: 620px) {
    .item-fila { grid-template-columns: 1fr 1fr 40px; }
    .item-fila .item-d { grid-column: 1 / 3; }

  }
  /* ── Horario de atención: un día por fila, con los tramos que haga falta ── */
  .horario { display: grid; gap: 2px; margin-bottom: 16px; }
  .hdia { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 12px; align-items: start;
    padding: 14px 0; border-top: 1px solid var(--linea); }
  .horario .hdia:first-child { border-top: 0; }
  .hdia-dia b { display: block; font-weight: 600; margin-bottom: 6px; }
  .hdia-cerrado { display: inline-flex; align-items: center; gap: 7px; font-size: .9rem; color: var(--tinta-suave); cursor: pointer; }
  .hdia-cerrado input { width: 18px; height: 18px; accent-color: var(--acento); cursor: pointer; }
  .hdia.cerrado .hdia-dia b { color: var(--tinta-suave); font-weight: 500; }
  .hdia-tramos { display: grid; gap: 8px; }
  .hdia-tramo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px; gap: 8px; align-items: end; }
  .hdia-tramo .campo { margin: 0; gap: 3px; }
  .hdia-tramo label { font-size: .75rem; font-weight: 500; color: var(--tinta-suave); }
  .hdia-sin { margin: 0; padding: 11px 0; color: var(--tinta-suave); font-size: .92rem; }
  .hdia-acciones { display: flex; gap: 6px; padding-top: 19px; }
  .hdia-btn { width: 40px; height: 42px; flex: none; border: 1.5px solid var(--linea); border-radius: 8px; background: var(--superficie);
    color: var(--tinta-suave); font-size: 1.25rem; line-height: 1; cursor: pointer; padding: 0; }
  .hdia-btn svg { width: 17px; height: 17px; }
  .hdia-btn:hover:not(:disabled) { border-color: var(--acento); color: var(--acento-oscuro); }
  .hdia-btn:disabled { opacity: .3; cursor: default; }
  @media (max-width: 760px) {
    .hdia { grid-template-columns: minmax(0, 1fr); gap: 10px; }

    .hdia-acciones { padding-top: 0; }

  /* Servicio o hardware: dos botones con su ícono */
  .tipo-sel { display: grid; grid-template-columns: 1fr 1fr; border: 1.5px solid var(--linea); border-radius: 8px; overflow: hidden; height: 42px; background: #fff; }

  .catalogo-fila { display: grid; grid-template-columns: 1fr 120px 130px 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .catalogo-fila input, .catalogo-fila select { padding: 10px 11px; border: 1.5px solid var(--linea); border-radius: 8px; font: inherit; background: #fff; min-width: 0; }
  @media (max-width: 620px) { .catalogo-fila { grid-template-columns: 1fr 1fr 40px; } .catalogo-fila input:first-child { grid-column: 1 / 3; } }

  /* Configuración y Acerca de */

  else if (/^\d{1,3}(\.\d{3})+$/.test(v)) v = v.replace(/\./g, '');
  return /^\d+(\.\d{1,2})?$/.test(v) ? v : null;
}

/* ── Teléfonos con código de país ──
   Se guardan como "+54 11 2345-6789". Los viejos sin "+" se toman como de Argentina. */
const PAISES = [
  ['54', '🇦🇷', 'Argentina'], ['598', '🇺🇾', 'Uruguay'], ['56', '🇨🇱', 'Chile'], ['595', '🇵🇾', 'Paraguay'],
  ['591', '🇧🇴', 'Bolivia'], ['55', '🇧🇷', 'Brasil'], ['51', '🇵🇪', 'Perú'], ['57', '🇨🇴', 'Colombia'],
  ['58', '🇻🇪', 'Venezuela'], ['593', '🇪🇨', 'Ecuador'], ['52', '🇲🇽', 'México'], ['506', '🇨🇷', 'Costa Rica'],
  ['507', '🇵🇦', 'Panamá'], ['53', '🇨🇺', 'Cuba'], ['502', '🇬🇹', 'Guatemala'], ['503', '🇸🇻', 'El Salvador'],
  ['504', '🇭🇳', 'Honduras'], ['505', '🇳🇮', 'Nicaragua'], ['1', '🇺🇸', 'EE.UU. / Canadá'], ['34', '🇪🇸', 'España'],
  ['39', '🇮🇹', 'Italia'], ['33', '🇫🇷', 'Francia'], ['49', '🇩🇪', 'Alemania'], ['44', '🇬🇧', 'Reino Unido'],
  ['351', '🇵🇹', 'Portugal'], ['41', '🇨🇭', 'Suiza'], ['31', '🇳🇱', 'Países Bajos'], ['972', '🇮🇱', 'Israel'],
  ['61', '🇦🇺', 'Australia']
];
const CODIGOS = PAISES.map((p) => p[0]).sort((a, b) => b.length - a.length);

function partirTelefono(tel) {
  const t = String(tel || '').trim();
  if (!t.startsWith('+')) return { cc: '54', numero: t };
  const d = digitos(t);
  const cc = CODIGOS.find((c) => d.startsWith(c));
  if (!cc) return { cc: '', numero: t };
  let resto = t.replace(/^\+\s*/, '');
  for (const ch of cc) resto = resto.replace(new RegExp('^\\D*' + ch), '');
  return { cc, numero: resto.trim() };
}
function unirTelefono(cc, numero) {
  const n = String(numero || '').trim();
  if (!n) return '';
  if (n.startsWith('+') || !cc) return n;
  return `+${cc} ${n}`;
}
const mostrarTel = (tel) => { const p = partirTelefono(tel); return p.cc ? unirTelefono(p.cc, p.numero) : String(tel || ''); };

function telWa(tel) {
  const p = partirTelefono(tel);
  if (!p.cc) return digitos(tel);
  let n = digitos(p.numero);
  if (!n) return '';
  if (p.cc === '54') {
    n = n.replace(/^0/, '');
    if (n.startsWith('9')) return '54' + n;
    if (n.length === 12) {   // código de área + 15 + número: se quita el 15
      for (const largo of [2, 3, 4]) if (n.substr(largo, 2) === '15') { n = n.slice(0, largo) + n.slice(largo + 2); break; }
    }
    return n.length === 10 ? '549' + n : '54' + n;
  }
  if (p.cc !== '39') n = n.replace(/^0/, '');
  return p.cc + n;
}
const telLlamar = (tel) => { const w = telWa(tel); return w ? '+' + w : ''; };

function campoTelefono(id, etiqueta, valor, extra = '') {
  const p = partirTelefono(valor);
  const cc = p.cc || '54';
  const numero = p.cc ? p.numero : String(valor || '');
  return `<div class="campo"><label for="${id}">${etiqueta}</label>
    <div class="tel-wrap">
      <select id="${id}_pais" aria-label="Código de país">${PAISES.map(([c, b, n]) => `<option value="${c}" ${c === cc ? 'selected' : ''} title="${esc(n)}">${b} +${c}</option>`).join('')}</select>
      <input type="tel" inputmode="tel" id="${id}" value="${esc(numero)}" autocomplete="off" placeholder="${cc === '54' ? '11 2345-6789' : 'Número'}" ${extra}>
    </div></div>`;
}
const leerTelefono = (id) => unirTelefono($(id + '_pais').value, $(id).value);
const numeroTelefono = (id) => digitos($(id).value);
const linkWa = (tel, texto) => `https://wa.me/${telWa(tel)}?text=${encodeURIComponent(texto)}`;

/* ═════════ API y sesión ═════════ */
/* A veces Google pierde el contenido del pedido y responde con la página de prueba
   en vez de los datos. En ese caso el pedido no llegó a la planilla y se reintenta solo. */
async function api(accion, extra = {}, espera = 45000) {
  let ultimo;
  for (let intento = 0; intento < 3; intento++) {
    try {
      return await pedir(accion, extra, espera);
    } catch (e) {
      if (!e.reintentar) throw e;
      ultimo = e;
      await new Promise((r) => setTimeout(r, 600 * (intento + 1)));
    }
  }
  throw ultimo;
}

async function pedir(accion, extra = {}, espera = 45000) {
  const sesion = leerSesion();
  const ctrl = new AbortController();
  const reloj = setTimeout(() => ctrl.abort(), espera);
  let res;
  try {
    res = await fetch(CONFIG.API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ accion, token: sesion && sesion.token, ...extra }),
      signal: ctrl.signal,
      redirect: 'follow',
      cache: 'no-store'
    });
  } catch (e) {
    throw new Error(e.name === 'AbortError'
      ? (accion === 'leerFoto' ? 'La lectura de la foto tardó demasiado. Probá de nuevo o sacá la foto más de cerca.' : 'La planilla tardó demasiado en responder.')
      : 'No hay conexión. Revisá internet.');
  } finally {
    clearTimeout(reloj);
  }
  if (!res.ok) throw new Error('No hay conexión con la planilla (' + res.status + ').');
  const texto = await res.text();
  let data;
  try {
    data = JSON.parse(texto);
  } catch (err) {
    const e = new Error('La planilla no respondió bien al pedido.');
    e.reintentar = true;
    throw e;
  }
  if (data.error === 'SESION') {
    borrarSesion();
    sucio = false;
    mostrarLogin(data.mensaje);
    const e = new Error(data.mensaje);
    e.sesion = true;
    throw e;
  }
  if (!data.ok) {
    // La planilla contesta esto cuando todavía tiene una versión vieja del código
    const viejo = data.error === 'Acción desconocida.';
    const e = new Error(viejo
      ? 'Tu planilla todavía tiene el código viejo. Pegá el Codigo.gs nuevo y publicá una versión nueva: Implementar → Administrar implementaciones → el lápiz → Versión: Nueva versión → Implementar.'
      : (data.error || 'Algo salió mal.'));
    e.rechazado = true;
    throw e;
  }
  return data;
}

/* ═════════ Cola de guardado en segundo plano ═════════
   Los cambios se ven al instante y se mandan a la planilla de a uno. */
const cola = [];
let procesandoCola = false;
let recargarAlVaciar = false;

function encolar(tarea) {
  cola.push(tarea);
  pintarCola();
  procesarCola();
}

async function procesarCola() {
  if (procesandoCola || !cola.length || !leerSesion()) { pintarCola(); return; }
  procesandoCola = true;
  while (cola.length) {
    const tarea = cola[0];
    tarea.error = null;
    pintarCola();
    try {
      const r = await api(tarea.accion, tarea.datos);
      cola.shift();
      const hayOtraIgual = cola.some((t) => t.clave === tarea.clave);
      if (tarea.alTerminar && !hayOtraIgual) tarea.alTerminar(r);
    } catch (e) {
      if (e.rechazado) {
        cola.shift();
        avisar('No se guardó en la planilla: ' + e.message, true);
        recargarAlVaciar = true;
        continue;
      }
      tarea.error = e.message;
      procesandoCola = false;
      pintarCola();
      if (!e.sesion) avisar('No se pudo guardar: ' + e.message + ' Tocá el aviso rojo para reintentar.', true);
      return;
    }
  }
  procesandoCola = false;
  pintarCola();
  if (recargarAlVaciar) {
    recargarAlVaciar = false;
    try { await cargarDatos(); if (!sucio) refrescarVista(); } catch (e) {}
  }
}

function pintarCola() {
  const el = $('estadoCola');
  if (!el) return;
  const conError = cola.some((t) => t.error);
  el.hidden = !cola.length && !actualizando;
  el.classList.toggle('error', conError);
  el.classList.toggle('actualizando', !cola.length && actualizando);
  el.textContent = conError ? 'Reintentar' : cola.length ? 'Guardando…' : 'Actualizando…';
  el.title = conError ? cola.find((t) => t.error).error : cola.length ? 'Guardando en la planilla' : 'Buscando novedades en la planilla';
}

}

/* ── Entrar con Google ──
   El botón lo dibuja Google con el client id que configuraste. Lo que vuelve es un
   token firmado por Google: lo verifica el Apps Script, que además chequea que el
   correo esté en la lista de Configuración. Acá no se guarda ninguna clave. */
let googleListo = false;
async function prepararGoogle() {
  if (googleListo) return;
  try {
    const r = await api('inicio', {}, 15000);
    if (!r.google || !r.google_client_id) return;
    await new Promise((ok, mal) => {
      if (window.google && google.accounts && google.accounts.id) return ok();
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client';
      s.async = true; s.defer = true;
      s.onload = ok; s.onerror = () => mal(new Error('sin conexión con Google'));
      document.head.appendChild(s);
    });
    google.accounts.id.initialize({
      client_id: r.google_client_id,
      callback: entrarConGoogle,
      cancel_on_tap_outside: true,
      auto_select: false
    });
    google.accounts.id.renderButton($('botonGoogle'), {
      theme: 'outline', size: 'large', width: 320, shape: 'rectangular',
      text: 'signin_with', locale: 'es-419'
    });
    $('cajaGoogle').hidden = false;
    googleListo = true;
  } catch (e) {
    // Sin Google configurado o sin internet: queda el usuario y contraseña de siempre
  }
}
async function entrarConGoogle(respuesta) {
  $('errorLogin').hidden = true;
  try {
    const r = await api('loginGoogle', { credencial: respuesta.credential }, 25000);
    guardarSesion(r.token, r.vence);
    $('clave').value = '';
    iniciarApp();
  } catch (e) {
    try { google.accounts.id.disableAutoSelect(); } catch (x) {}
    $('errorLogin').textContent = e.message || 'No se pudo entrar con Google.';
    $('errorLogin').hidden = false;
  }
}

function fotoAJpeg(archivo, maxLado = 1400) {
  return new Promise((ok, mal) => {
    if (!archivo || !/^image\//.test(archivo.type)) return mal(new Error('Eso no es una foto.'));
    const lector = new FileReader();
    lector.onerror = () => mal(new Error('No pude leer la foto.'));
    lector.onload = () => {
      const img = new Image();
      img.onerror = () => mal(new Error('No pude abrir la foto.'));
      img.onload = () => {
        const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * escala));
        c.height = Math.max(1, Math.round(img.height * escala));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      img.src = lector.result;
    };
    lector.readAsDataURL(archivo);
  });
}
const botonFoto = (id) => `
  <button class="btn btn-secundario btn-auto" type="button" id="${id}">${ICONO.camara} Leer de una foto</button>

// poner(campo, valor) decide dónde va cada dato leído
function conectarBotonFoto(id, poner) {
  const b = $(id), archivo = $(id + 'Archivo'), estado = $(id + 'Estado');
  if (!b || !archivo) return;
  // El resultado queda escrito al lado del botón: un cartel que se va solo es fácil de perder
  const decir = (texto, mal) => {
    if (!estado) return avisar(texto, mal);
    estado.textContent = texto;
    estado.hidden = !texto;
    estado.classList.toggle('mal', !!mal);
  };
  b.onclick = () => {
    if (!(DB.ajustes && DB.ajustes.gemini)) {
      return decir('Primero cargá la clave de Gemini en Configuración.', true);
    }
    archivo.click();
  };
  archivo.addEventListener('change', async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    const original = b.innerHTML;
    b.disabled = true; b.textContent = 'Leyendo la foto…';
    decir('');
    try {
      const imagen = await fotoAJpeg(f);
      const r = await api('leerFoto', { imagen, tipo: 'image/jpeg' }, 120000);
      const eq = r.equipo || {};
      const leidos = ['marca', 'modelo', 'serie'].filter((k) => eq[k]);
      if (!leidos.length) throw new Error('No se leyó ningún dato en la foto. Probá con más luz, más cerca de la etiqueta y sin reflejos.');
      leidos.forEach((k) => poner(k, eq[k]));
      decir(`Leí ${leidos.join(', ')}. Revisalo antes de guardar.`);
      avisar('Datos leídos de la foto');
    } catch (err) {
      decir(err.message || 'No se pudo leer la foto.', true);
    } finally {
      b.disabled = false; b.innerHTML = original;
    }
  });
}

function leerFormularioSeguro(form, base) {
  try {
    const d = {};
    form.querySelectorAll('[name]').forEach((el) => {
      if (el.type === 'radio' && !el.checked) return;
      let v = el.value.trim();
      if (el.dataset.tipo === 'fecha') v = deISO(v);
      if (el.dataset.tipo === 'fechahora') v = deISOhora(v);
      if (el.dataset.tipo === 'plata') v = (parsePlata(v) === null ? (base ? base[el.name] : '') : parsePlata(v));
      d[el.name] = v;
    });
    return d;
  } catch (e) { return {}; }
}

function leerFormulario(form) {
  const d = {};
  form.querySelectorAll('[name]').forEach((el) => {
    if (el.type === 'radio' && !el.checked) return;   // de los redondos vale el elegido
    let v = el.value.trim();
    if (el.dataset.tipo === 'fecha') v = deISO(v);
    if (el.dataset.tipo === 'fechahora') v = deISOhora(v);
    if (el.dataset.tipo === 'plata') {
      const p = parsePlata(v);
      if (p === null) {
        el.focus();
        throw new Error(`Revisá el importe de "${form.querySelector(`label[for="${el.id}"]`).textContent}".`);
      }
      v = p;
    }
    d[el.name] = v;
  });
  return d;
}

  const c = {};

}

function mensajeWhatsapp(o) {
  const base = mensajeWhatsappBase(o);
  // Una vez entregado ya no sirve el seguimiento: va el link para dejar la reseña
  if (o.estado === 'Entregado' && CONFIG.linkResenas) {
    return `${base}\n\nSi te quedó un minuto, dejame una reseña acá: ${CONFIG.linkResenas}`;

  const link = linkSeguimiento(o);
  let msg = link ? `${base}\n\nPodés ver el estado de tu equipo acá: ${link}` : base;

  if (o.estado === 'Ingresado') msg += `\n\nTérminos y condiciones del servicio: ${location.origin}/terminos`;

const tiempoDe = (t) => { const d = parseFecha(t); return d ? d.getTime() : null; };

function resumenCliente(c) {
  const ords = ordenar(DB.ordenes.filter((o) => o.cliente_id === c.id));
  const rems = DB.remotas.filter((r) => r.cliente_id === c.id);
  const fechas = [...ords.map((o) => parseFecha(o.fecha_ingreso)), ...rems.map((r) => parseFecha(r.fecha))].filter(Boolean);
  const ultima = fechas.length ? new Date(Math.max(...fechas)) : null;
  return {
    ords, rems,
    enTaller: ords.filter((o) => !FINALES.includes(o.estado)).length,
    debe: suma(ords.filter(tieneSaldo), saldo) + suma(rems, saldoRemota),
    ultimaTiempo: ultima ? ultima.getTime() : null,
    ultima: ultima ? `${dos(ultima.getDate())}/${dos(ultima.getMonth() + 1)}/${ultima.getFullYear()}` : ''
  };
}

const ORDEN_INICIAL = { ordenes: { campo: 'numero', dir: 'desc' }, remoto: { campo: 'id', dir: 'desc' }, clientes: { campo: 'nombre', dir: 'asc' } };
const ORDEN_KEY = 'rtc_taller_orden_';
const PINTORES = {};

function estadoOrden(seccion) {
  try {
    const o = JSON.parse(localStorage.getItem(ORDEN_KEY + seccion));
    if (o && COLUMNAS[seccion][o.campo] && (o.dir === 'asc' || o.dir === 'desc')) return o;
  } catch (e) {}
  return { ...ORDEN_INICIAL[seccion] };
}
function ordenarLista(lista, seccion) {
  const orden = estadoOrden(seccion);
  const col = COLUMNAS[seccion][orden.campo];
  const signo = orden.dir === 'desc' ? -1 : 1;
  const vacio = (v) => v === null || v === undefined || v === '' || (typeof v === 'number' && isNaN(v));
  // Se calcula una vez por elemento y los vacíos quedan siempre al final
  return lista.map((x) => ({ x, v: col.valor(x) })).sort((a, b) => {
    const ea = vacio(a.v), eb = vacio(b.v);
    if (ea || eb) return ea === eb ? 0 : ea ? 1 : -1;
    const r = col.tipo === 'texto'
      ? String(a.v).localeCompare(String(b.v), 'es', { sensitivity: 'base', numeric: true })
      : a.v - b.v;
    return r * signo;
  }).map((y) => y.x);
}
function textoDireccion(col, dir) {
  const et = col.etiquetas || (col.tipo === 'texto' ? ['A a Z', 'Z a A'] : col.tipo === 'fecha' ? ['Más antiguas primero', 'Más recientes primero'] : ['Menor a mayor', 'Mayor a menor']);
  const flecha = dir === 'asc'
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
  return flecha + '<span>' + (dir === 'asc' ? et[0] : et[1]) + '</span>';
}
function selectorOrden(seccion) {
  const o = estadoOrden(seccion);
  const cols = COLUMNAS[seccion];
  return `<div class="orden-ctrl">
    <label class="solo-lector" for="ordenCampo_${seccion}">Ordenar por</label>
    <select id="ordenCampo_${seccion}">${Object.entries(cols).map(([k, c]) => `<option value="${k}" ${k === o.campo ? 'selected' : ''}>Por ${esc(c.nombre)}</option>`).join('')}</select>
    <button type="button" class="btn-dir" id="ordenDir_${seccion}" title="Cambiar el sentido">${textoDireccion(cols[o.campo], o.dir)}</button>
  </div>`;
}
function fijarOrden(seccion, orden) {
  try { localStorage.setItem(ORDEN_KEY + seccion, JSON.stringify(orden)); } catch (e) {}
  const sel = $('ordenCampo_' + seccion);

const tip = (texto) => `<span class="tip-caja"><button class="tip" type="button" aria-expanded="false" aria-label="Ver la explicación" title="Ver la explicación">?</button><span class="tip-txt" role="note" hidden>${texto}</span></span>`;
const cerrarTips = (menos) => document.querySelectorAll('.tip[aria-expanded="true"]').forEach((b) => {
  if (b === menos) return;
  b.setAttribute('aria-expanded', 'false');
  b.nextElementSibling.hidden = true;
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('.tip');
  cerrarTips(b);
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const abrir = b.getAttribute('aria-expanded') !== 'true';
  b.setAttribute('aria-expanded', abrir ? 'true' : 'false');
  const globo = b.nextElementSibling;
  globo.hidden = !abrir;
  if (abrir) acomodarTip(globo);
});
/* El globo se posiciona contra la pantalla, no contra el botón: así nunca se sale,
   esté el signo de pregunta donde esté (título largo, borde derecho, celular). */
function acomodarTip(globo) {
  const boton = globo.previousElementSibling;
  const b = boton.getBoundingClientRect();
  const margen = 12;
  globo.style.position = 'fixed';
  globo.style.top = Math.round(b.bottom + 8) + 'px';
  globo.style.left = '0px';
  const ancho = globo.getBoundingClientRect().width;
  const x = Math.min(Math.max(margen, b.left - 8), window.innerWidth - ancho - margen);
  globo.style.left = Math.round(Math.max(margen, x)) + 'px';
}
// Si se mueve la pantalla, el globo quedaría flotando: se cierra

function leerTablero() {
  let g = null;
  try { g = JSON.parse(localStorage.getItem(TABLERO_KEY) || 'null'); } catch (e) { g = null; }
  const orden = Array.isArray(g && g.orden) ? g.orden.filter((x) => BLOQUES_TABLERO.includes(x)) : [];
  BLOQUES_TABLERO.forEach((x) => { if (!orden.includes(x)) orden.push(x); });
  const ocultos = Array.isArray(g && g.ocultos) ? g.ocultos.filter((x) => BLOQUES_TABLERO.includes(x)) : [];
  return { orden, ocultos };
}

// Acomoda los bloques para que no queden huecos entre uno y otro
function acomodarTablero() {
  const g = $('grillaTablero');
  if (!g) return;
  const filas = 8, hueco = 14;
  const unaColumna = getComputedStyle(g).gridTemplateColumns.split(' ').length < 2;
  [...g.children].forEach((el) => {
    if (unaColumna) { el.style.gridRowEnd = ''; return; }
    const alto = el.getBoundingClientRect().height;
    el.style.gridRowEnd = 'span ' + Math.max(1, Math.ceil((alto + hueco) / (filas + hueco)));
  });
}

/* ═════════ Órdenes ═════════ */
let filtroOrdenes = 'activas';
let busquedaOrdenes = '';

function coincideFiltro(o, f) {
  if (f === 'todas') return true;
  if (f === 'activas') return !FINALES.includes(o.estado);
  if (f === 'vencidas') return esVencida(o);
  if (f === 'a-cobrar') return tieneSaldo(o);
  if (f === 'lab') return esLab(o.estado);
  if (f === 'presupuestos') return esperandoRespuesta(o);
  if (f.startsWith('estado:')) return o.estado === f.slice(7);
  return true;
}

function vistaOrdenes(param) {
  if (param) filtroOrdenes = param;
  const opciones = [['activas', 'En el taller'], ['todas', 'Todas'], ['lab', 'En laboratorio (las tres etapas)'], ['presupuestos', 'Esperando respuesta al presupuesto'], ['vencidas', 'Demoradas en laboratorio'], ['a-cobrar', 'Con saldo a cobrar'], ...ESTADOS.map((e) => ['estado:' + e, e])];

  $('contenido').innerHTML = `
    <div class="cab-vista">
      <h1>Órdenes</h1>
      <a class="btn btn-principal btn-auto" href="#ingreso">Ingresar equipo</a>
    </div>
    <div class="filtros">
      <input type="search" id="oBuscar" placeholder="Buscar por número, cliente, teléfono, equipo o serie" value="${esc(busquedaOrdenes)}" aria-label="Buscar órdenes">
      <select id="oFiltro" aria-label="Filtrar por estado">${opciones.map(([v, t]) => `<option value="${esc(v)}" ${v === filtroOrdenes ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select>
    </div>
    <div class="barra-lista"><p class="contador" id="oContador"></p><div class="barra-controles">${selectorOrden('ordenes')}${selectorVista('ordenes')}</div></div>
    <div class="lista dos" id="oLista"></div>`;

  const pintar = () => {
    const q = normalizar(busquedaOrdenes.trim());
    const qd = digitos(busquedaOrdenes);
    let lista = DB.ordenes.filter((o) => coincideFiltro(o, filtroOrdenes));
    if (q) {
      lista = lista.filter((o) =>
        normalizar([o.numero, o.cliente, o.tipo, o.marca, o.modelo, o.serie, o.falla].join(' ')).includes(q) ||
        (qd.length >= 3 && digitos(o.telefono).includes(qd)));
    }
    lista = ordenarLista(lista, 'ordenes');
    $('oContador').textContent = `${lista.length} ${pl(lista.length, 'orden', 'órdenes')}`;
    pintarListado('oLista', 'ordenes', lista, tarjetaOrden, tablaOrdenes,
      `<div class="vacio">No hay órdenes con ese filtro.${filtroOrdenes !== 'todas' ? ' Probá con "Todas".' : ''}</div>`);
  };

  $('oBuscar').addEventListener('input', (e) => { busquedaOrdenes = e.target.value; pintar(); });
  $('oFiltro').addEventListener('change', (e) => {
    filtroOrdenes = e.target.value;
    rutaActual = '#ordenes/' + encodeURIComponent(filtroOrdenes);
    history.replaceState(null, '', rutaActual);
    pintar();
  });
  conectarSelectorVista('ordenes', pintar);
  conectarOrden('ordenes', pintar);
  pintar();
}

/* Los hitos de la orden, ordenados por la fecha real en que pasaron.
   Los que todavía no ocurrieron quedan al final, en su orden natural. */
function listaHitos(o, editable = true) {
  const espera = diasEsperando(o);
  // Con el bloque en modo lectura, cada hito es texto; al editar, son campos
  const fijo = (l, v, pendiente = 'Pendiente') => `<div class="hito-fijo"><strong>${l}</strong><span>${v ? esc(v) : pendiente}</span></div>`;
  const fh = (n, l, v) => editable ? campoFechaHora(n, l, v) : fijo(l, v);
  const fe = (n, l, v) => editable ? campoFecha(n, l, v) : fijo(l, v);
  const hitos = [
    { fecha: parseFecha(o.fecha_ingreso), hecho: true,
      cuerpo: `<div class="hito-fijo"><strong>Recibido</strong><span>${esc(o.fecha_ingreso)}</span></div>` },
    { fecha: parseFecha(o.fecha_presupuesto), hecho: !!o.fecha_presupuesto,
      cuerpo: fh('fecha_presupuesto', 'Presupuestado', o.fecha_presupuesto) +
        (esperandoRespuesta(o) && espera !== null
          ? `<p class="hito-info ${espera >= 7 ? 'rojo' : ''}">Esperando la confirmación del cliente ${espera === 0 ? 'desde hoy' : espera === 1 ? 'desde ayer' : `hace ${espera} días`}.</p>`
          : '') },
    { fecha: parseFecha(o.fecha_respuesta), hecho: !!o.respuesta_presupuesto,
      cuerpo: fijo('Respuesta del cliente', o.respuesta_presupuesto, 'Sin responder') +
        (o.respuesta_presupuesto ? fijo('Cuándo respondió', o.fecha_respuesta) : '') +
        (o.respuesta_presupuesto === 'Rechazado' && !FINALES.includes(o.estado)
          ? '<p class="hito-info">No avanza la reparación. Cuando tengas el equipo listo para devolvérselo, pasá la orden a "Listo para retirar".</p>' : '') },
    ...(!(o.fecha_lab_envio || o.fecha_lab_retiro || enLaboratorio(o)) ? [] : [
    { fecha: parseFecha(o.fecha_lab_envio), hecho: !!o.fecha_lab_envio,
      cuerpo: fe('fecha_lab_envio', 'Ingresó a laboratorio', o.fecha_lab_envio) +
        (enLaboratorio(o) ? `<p class="hito-info ${esVencida(o) ? 'rojo' : ''}">Lleva ${dh(diasLab(o))}${o.laboratorio ? ' en ' + esc(o.laboratorio) : ''}. Se espera entre el ${fechaTexto(sumarHabiles(parseFecha(o.fecha_lab_envio), LAB_DIAS[0]))} y el ${fechaTexto(sumarHabiles(parseFecha(o.fecha_lab_envio), LAB_DIAS[1]))}.</p>` : '') },
    { fecha: parseFecha(o.fecha_lab_retiro), hecho: !!o.fecha_lab_retiro,
      cuerpo: fe('fecha_lab_retiro', 'Retirado de laboratorio', o.fecha_lab_retiro) +
        (o.fecha_lab_envio && o.fecha_lab_retiro ? `<p class="hito-info">Estuvo ${dh(diasLab(o))} en el laboratorio.</p>` : '') }]),
    { fecha: parseFecha(o.fecha_listo), hecho: !!o.fecha_listo,
      cuerpo: fh('fecha_listo', o.estado === 'Sin reparación' ? 'Diagnóstico listo (sin reparación)' : 'Listo para retirar', o.fecha_listo) +
        (o.estado === 'Sin reparación' ? '<p class="hito-info">El equipo no tiene reparación. Avisale al cliente y, cuando lo tengas preparado para devolver, pasá la orden a "Listo para retirar".</p>' : '') },
    { fecha: FINALES.includes(o.estado) ? parseFecha(o.fecha_entrega) : null, hecho: FINALES.includes(o.estado),
      cuerpo: fe('fecha_entrega', 'Entregado al cliente', o.fecha_entrega) +
        (FINALES.includes(o.estado) && parseFecha(o.fecha_entrega) ? `<p class="hito-info">En total: ${diasEntre(parseFecha(o.fecha_ingreso), parseFecha(o.fecha_entrega))} días corridos desde que lo recibiste.</p>` : '') }
  ];
  // Siempre en el mismo orden: recibido, presupuesto, respuesta, laboratorio, listo y entrega
  return hitos
    .map((h) => `<li class="hito ${h.hecho ? 'hecho' : ''}"><span class="hito-punto" aria-hidden="true"></span>${h.cuerpo}</li>`)
    .join('');
}

// En qué paso va la orden, para leerlo con el bloque de seguimiento cerrado
function hitosHechos(o) {
  const pasos = [
    ['Recibido', !!o.fecha_ingreso],
    ['el presupuesto', !!o.fecha_presupuesto],
    ['la respuesta del cliente', !!o.respuesta_presupuesto],
    ...(o.fecha_lab_envio || enLaboratorio(o) ? [['que vuelva del laboratorio', !!o.fecha_lab_retiro]] : []),
    [o.estado === 'Sin reparación' ? 'el diagnóstico final' : 'que quede listo', !!o.fecha_listo],
    ['la entrega', FINALES.includes(o.estado)]
  ];
  const falta = pasos.find(([, hecho]) => !hecho);
  const hechos = pasos.filter(([, h]) => h).length;
  return falta ? `${hechos} de ${pasos.length} pasos · falta ${falta[0]}` : `Los ${pasos.length} pasos completos`;
}

/* Los datos de un bloque, leídos de lo que hay en el formulario ahora mismo */
function pintarDatosForm(form, mapa) {
  Object.entries(mapa).forEach(([clave, campos]) => {
    const caja = form.querySelector(`[data-datos="${clave}"]`);
    if (!caja) return;
    caja.innerHTML = campos.map(([n, et, tipo]) => {
      const el = form.elements[n];
      let v = el ? String(el.value).trim() : '';
      if (tipo === 'plata') { const p = num(parsePlata(v)); v = p ? plata(p) : ''; }
      if (tipo === 'fecha') v = deISO(v);
      if (tipo === 'pct') v = (Number(v) || 0) + '%';
      if (tipo === 'oculto') v = v ? '•'.repeat(Math.min(14, v.length)) : '';
      if (tipo === 'texto-sel' && el && el.selectedOptions && el.selectedOptions[0]) v = el.selectedOptions[0].textContent;
      return `<button class="dato ${v ? '' : 'sin'}" type="button" data-campo="${n}">
        <span>${et}</span><b>${v ? esc(v) : 'Sin cargar'}</b></button>`;
    }).join('');
  });
}

/* Abrir y cerrar bloques, y pasar de leer a editar. `estado.claves` recuerda
   cuáles quedaron abiertos para no perderlos al volver a dibujar. */
function conectarPlegables(form, estado, repintar) {
  const abrir = (clave, si) => {
    const sec = form.querySelector(`.plega[data-b="${clave}"]`);
    if (!sec) return;
    // De a uno: al abrir uno se cierran los demás
    if (si) form.querySelectorAll('.plega.abierto').forEach((otro) => {
      if (otro === sec) return;
      otro.classList.remove('abierto', 'editando');
      otro.querySelector('.plega-abrir').setAttribute('aria-expanded', 'false');
    });
    sec.classList.toggle('abierto', si);
    sec.querySelector('.plega-abrir').setAttribute('aria-expanded', si ? 'true' : 'false');
    if (!si) sec.classList.remove('editando');
    estado.claves = [...form.querySelectorAll('.plega.abierto')].map((x) => x.dataset.b);
  };
  const editar = (clave, campo) => {
    const sec = form.querySelector(`.plega[data-b="${clave}"]`);
    if (!sec) return;
    abrir(clave, true);
    sec.classList.add('editando');
    const el = campo ? form.elements[campo] : sec.querySelector('.edicion input, .edicion textarea, .edicion select');
    if (el && el.focus) el.focus();
  };
  form.addEventListener('click', (e) => {
    const cab = e.target.closest('[data-plega]');
    if (cab) { abrir(cab.dataset.plega, !cab.closest('.plega').classList.contains('abierto')); return; }
    const lapiz = e.target.closest('[data-editar]');
    if (lapiz) { editar(lapiz.dataset.editar); return; }
    const listo = e.target.closest('[data-listo]');
    if (listo) { form.querySelector(`.plega[data-b="${listo.dataset.listo}"]`).classList.remove('editando'); if (repintar) repintar(); return; }
    const dato = e.target.closest('.dato[data-campo]');
    if (dato) editar(dato.closest('.plega').dataset.b, dato.dataset.campo);
  });
  (estado.claves || []).forEach((k) => abrir(k, true));
  return { abrir, editar };
}

      equipo: descEquipo(d) || 'Sin cargar',

      presupuesto: items.length ? `${items.length} ${pl(items.length, 'ítem', 'ítems')} · ${plata(totalItems(items))}` : (total ? plata(total) : 'Sin armar'),
      cobro: !total && !cobrado ? 'Sin cargar' : (saldo ? `Falta cobrar ${plata(saldo)}` : `Cobrado ${plata(cobrado)}`),
      entrega: 'La imagen del trabajo, para WhatsApp',
      seguimiento: hitosHechos(d),
      historial: historial.length ? `${historial.length} ${pl(historial.length, 'movimiento', 'movimientos')}` : 'Sin movimientos',
      link: o.codigo_seguimiento ? 'Activo' : 'Sin link'
    };
    Object.entries(res).forEach(([k, v]) => {
      const e = form.querySelector(`[data-res="${k}"]`);
      if (e) e.textContent = v;
    });
  };
  const repintarLectura = () => {
    pintarDatos();
    if ($('hitosLectura')) $('hitosLectura').innerHTML = listaHitos(enPantalla(), false);
    pintarFicha();
    pintarResumenes();
  };

  conectarPlegables(form, abiertos, repintarLectura);

  pintarItems();
  repintarLectura();

  form.addEventListener('input', () => { marcarSucio(true); pintarPlata(); pintarEstado(); pintarPresupuesto(); pintarFicha(); pintarResumenes(); });
  const pintarRespuesta = () => {
    const caja = $('cuandoRespondio');
    if (!caja) return;
    const elegido = form.querySelector('input[name="respuesta_presupuesto"]:checked');
    const hay = !!(elegido && elegido.value);
    const puesto = !!caja.querySelector('[name="fecha_respuesta"]');
    if (hay && !puesto) caja.innerHTML = campoFechaHora('fecha_respuesta', 'Cuándo respondió', o.fecha_respuesta || '');
    else if (!hay && puesto) caja.innerHTML = '';
  };
  form.addEventListener('change', () => { marcarSucio(true); pintarEstado(); pintarRespuesta(); repintarLectura(); });
  form.addEventListener('submit', (e) => { e.preventDefault(); if (guardarActual) guardarActual(); });

  guardarActual = async () => {
    try {
      const cambios = diferencias(leerFormulario(form), o);
      if (!Object.keys(cambios).length) { marcarSucio(false); return; }
      reemplazar(DB.ordenes, 'numero', aplicarCambiosOrden(o, cambios));
      marcarSucio(false);
      avisar('Cambios guardados');
      refrescarVista();
      const destino = '#orden/' + encodeURIComponent(o.numero);
      encolar({
        clave: 'orden:' + o.numero,
        accion: 'actualizarOrden',
        datos: { numero: o.numero, cambios },
        alTerminar: (r) => {
          reemplazar(DB.ordenes, 'numero', r.orden);
          if (location.hash === destino && !sucio) refrescarVista();
        }
      });
    } catch (e) {
      avisar(e.message, true);
    }
  };

  // El link del cliente se copia desde la ficha (los botones se vuelven a dibujar, por eso va delegado)
  $('ficha').addEventListener('click', async (e) => {
    if (!e.target.closest('#fichaCopiarLink')) return;
    try { await navigator.clipboard.writeText(linkSeguimiento(o)); avisar('Link copiado'); }
    catch (err) { avisar('No se pudo copiar. Abrilo con el otro botón y copialo del navegador.', true); }
  });

  if ($('segCopiar')) $('segCopiar').onclick = async () => {
    const t = $('segLink');
    try { await navigator.clipboard.writeText(t.value); } catch (e) { t.select(); document.execCommand('copy'); }
    avisar('Link copiado');
  };
  $('segNuevo').onclick = async () => {
    if (o.codigo_seguimiento && !confirm('El link actual va a dejar de funcionar. ¿Generar uno nuevo?')) return;
    if (sucio) { avisar('Guardá los cambios antes de generar el link.', true); return; }
    const b = $('segNuevo');
    b.disabled = true; b.textContent = 'Generando…';
    try {
      const r = await api('generarSeguimiento', { numero: o.numero }, 25000);
      reemplazar(DB.ordenes, 'numero', r.orden);
      avisar('Link de seguimiento listo');
      refrescarVista();
    } catch (e) {
      avisar(e.message, true);
      b.disabled = false; b.textContent = o.codigo_seguimiento ? 'Generar un link nuevo' : 'Crear link de seguimiento';
    }
  };

  $('btnImprimir').onclick = () => {
    if (sucio) { avisar('Guardá los cambios antes de imprimir.', true); return; }
    armarComprobante(o);
    window.print();
  };

  if ($('btnGarantia')) $('btnGarantia').onclick = async () => {
    if (sucio) { avisar('Guardá los cambios antes de abrir el reingreso.', true); return; }
    if (!confirm('¿Abrir una orden nueva por garantía de ' + o.numero + '? Queda vinculada a esta, con presupuesto en $0.')) return;
    const b = $('btnGarantia');
    b.disabled = true; b.textContent = 'Abriendo…';
    try {
      const r = await api('crearOrden', { datos: {
        cliente: { modo: 'existente', id: o.cliente_id },
        equipo: { tipo: o.tipo, marca: o.marca, modelo: o.modelo, serie: o.serie, clave: o.clave_equipo },
        accesorios: [],
        falla: 'Reingreso por garantía de ' + o.numero + '. Reparación anterior: ' + (o.falla || '').trim(),
        estadoIngreso: [],
        observaciones: '',
        garantiaDe: o.numero
      } }, 25000);
      reemplazar(DB.ordenes, 'numero', r.orden);
      if (r.original) reemplazar(DB.ordenes, 'numero', r.original);
      location.hash = '#orden/' + encodeURIComponent(r.orden.numero);
    } catch (e) {
      avisar(e.message || 'No se pudo abrir el reingreso.', true);
      b.disabled = false; b.textContent = 'Reingreso por garantía';
    }
  };

  /* ── Borrar la orden ──
     Dos pasos a propósito: el primero muestra qué se va a borrar. */
  $('btnBorrarOrden').onclick = () => {
    const zona = $('zonaBorrar');
    const aviso = num(o.cobrado) ? `<span>Figura cobrado ${esc(plata(num(o.cobrado)))}: revisá que no sea la orden buena.</span>` : '';
    zona.classList.add('confirmando');
    zona.innerHTML = `
      <p class="riesgo-aviso">
        <b>¿Borrar la orden ${esc(o.numero)}?</b>
        <span>${esc(o.cliente)} · ${esc(descEquipo(o) || 'equipo sin cargar')} · ${esc(o.estado)}</span>
        ${aviso}
      </p>
      <div class="botones-fila">
        <button class="btn-riesgo btn-confirmar" type="button" id="borrarSi">${ICONO.basura} Sí, borrar</button>
        <button class="btn-riesgo" type="button" id="borrarNo">Cancelar</button>
      </div>
      <p class="ayuda" style="margin:10px 0 0">Queda guardada en la hoja <b>Papelera</b> de tu planilla.</p>`;
    $('borrarNo').onclick = () => vistaOrden(o.numero);
    $('borrarSi').onclick = async () => {
      const b = $('borrarSi');
      b.disabled = true; b.textContent = 'Borrando…';
      try {
        await api('borrarOrden', { numero: o.numero, motivo: 'Borrada desde la app' }, 25000);
        DB.ordenes = DB.ordenes.filter((x) => x.numero !== o.numero);
        guardarDBLocal();
        sucio = false;
        marcarSucio(false);
        avisar(`Orden ${o.numero} borrada`);
        location.hash = '#ordenes';
      } catch (e) {
        avisar(e.message, true);
        b.disabled = false; b.innerHTML = `${ICONO.basura} Sí, borrar`;
      }
    };
  };
}

let busquedaClientes = '';

function vistaClientes() {
  const porCliente = {};
  DB.ordenes.forEach((o) => { (porCliente[o.cliente_id] = porCliente[o.cliente_id] || []).push(o); });

  $('contenido').innerHTML = `

    </div>

    </div>
    <div class="barra-lista"><p class="contador" id="cliContador"></p><div class="barra-controles">${selectorOrden('clientes')}${selectorVista('clientes')}</div></div>
    <div class="lista dos" id="cliLista"></div>`;

  const pintar = () => {
    const q = normalizar(busquedaClientes.trim());
    const qd = digitos(busquedaClientes);
    let lista = DB.clientes;
    if (q) lista = lista.filter((c) => normalizar(c.nombre + ' ' + c.email).includes(q) || (qd.length >= 3 && digitos(c.telefono).includes(qd)));
    lista = ordenarLista(lista, 'clientes');
    $('cliContador').textContent = `${lista.length} ${pl(lista.length, 'cliente', 'clientes')}`;
    const resumen = resumenCliente;
    const tablaClientes = (items) => `<table class="tabla"><thead><tr>
      ${thOrden('clientes', 'nombre')}${thOrden('clientes', 'telefono', 'ocultar-movil')}${thOrden('clientes', 'ordenes', 'num')}${thOrden('clientes', 'remotas', 'num ocultar-movil')}
      ${thOrden('clientes', 'en_taller', 'num ocultar-movil')}${thOrden('clientes', 'ultima', 'ocultar-movil')}${thOrden('clientes', 'origen', 'ocultar-movil ocultar-medio')}${thOrden('clientes', 'saldo', 'num')}
    </tr></thead><tbody>${items.map((c) => {
      const x = resumen(c);
      return filaTabla('#cliente/' + encodeURIComponent(c.id), `
        <td class="principal">${esc(c.nombre)}<span class="sub">${esc(mostrarTel(c.telefono))}</span></td>
        <td class="nw ocultar-movil">${esc(mostrarTel(c.telefono))}</td>
        <td class="num">${x.ords.length}</td>
        <td class="num ocultar-movil">${x.rems.length}</td>
        <td class="num ocultar-movil">${x.enTaller || '—'}</td>
        <td class="nw ocultar-movil">${esc(x.ultima) || '—'}</td>
        <td class="nw ocultar-movil ocultar-medio">${esc(origenCliente(c)) || '—'}</td>
        <td class="num ${x.debe ? 'rojo' : ''}">${x.debe ? plata(x.debe) : '—'}</td>`);
    }).join('')}</tbody></table>`;
    const tarjetaCliente = (c) => {
      const { ords, rems, enTaller, debe } = resumen(c);
      return `<a class="tarjeta" href="#cliente/${encodeURIComponent(c.id)}">
        <div class="t-cab"><span class="t-titulo">${esc(c.nombre)}</span>${enTaller ? `<span class="badge" style="--c:var(--acento)">${enTaller} en el taller</span>` : ''}</div>
        <div class="t-sub">${esc(mostrarTel(c.telefono))}</div>
        <div class="t-pie"><span>${ords.length} ${pl(ords.length, 'orden', 'órdenes')}</span>${rems.length ? `<span>${rems.length} ${pl(rems.length, 'remota', 'remotas')}</span>` : ''}${ords[0] ? `<span>Última: ${esc(soloFecha(ords[0].fecha_ingreso))}</span>` : ''}${debe ? `<span class="vencida">Debe ${plata(debe)}</span>` : ''}</div>
      </a>`;
    };
    pintarListado('cliLista', 'clientes', lista, tarjetaCliente, tablaClientes, '<div class="vacio">No hay clientes con esa búsqueda.</div>');
  };
  $('cliBuscar').addEventListener('input', (e) => { busquedaClientes = e.target.value; pintar(); });
  conectarSelectorVista('clientes', pintar);
  conectarOrden('clientes', pintar);
  pintar();
}

function vistaCliente(id) {
  if (id === 'nuevo') return vistaClienteNuevo();
  const c = DB.clientes.find((x) => x.id === id);
  if (!c) {
    $('contenido').innerHTML = `<a class="volver" href="#clientes">${ICONO.atras} Clientes</a><div class="vacio">No encontré ese cliente. Probá actualizar los datos.</div>`;
    return;
  }
  const ords = ordenar(DB.ordenes.filter((o) => o.cliente_id === id));
  const enTaller = ords.filter((o) => !FINALES.includes(o.estado)).length;
  const rems = ordenarRemotas(DB.remotas.filter((r) => r.cliente_id === id));
  const facturado = suma(ords.filter((o) => o.estado === 'Entregado'), (o) => num(o.presupuesto)) + suma(rems, (r) => num(r.total));
  const debe = suma(ords.filter(tieneSaldo), saldo) + suma(rems, saldoRemota);
  const nombre = c.nombre.split(' ')[0];

  $('contenido').innerHTML = `
    <div class="angosto">
      <a class="volver" href="#clientes">${ICONO.atras} Clientes</a>
      <h1>${esc(c.nombre)}</h1>
      <p class="bajada">Cliente desde el ${esc(soloFecha(c.alta)) || '—'}</p>

      <div class="botones-fila" style="margin-bottom:14px">
        <a class="btn btn-principal" href="#ingreso/${encodeURIComponent(c.id)}">Ingresar equipo</a>
        <a class="btn btn-secundario" href="#remoto/nueva/${encodeURIComponent(c.id)}">Asistencia remota</a>
        <a class="btn btn-secundario" href="${linkWa(c.telefono, `Hola ${nombre}, soy ${CONFIG.firmaWhatsapp} de ${CONFIG.negocio}.`)}" target="_blank" rel="noopener">WhatsApp</a>
        <a class="btn btn-secundario" href="tel:${esc(telLlamar(c.telefono))}">Llamar</a>
      </div>

      <div class="cifras cuatro" style="margin-bottom:14px">
        <div class="cifra"><span class="cifra-valor">${ords.length}</span><span class="cifra-nombre">${pl(ords.length, 'Orden', 'Órdenes')}</span></div>
        <div class="cifra"><span class="cifra-valor">${enTaller}</span><span class="cifra-nombre">En el taller</span></div>
        <div class="cifra"><span class="cifra-valor">${plata(facturado)}</span><span class="cifra-nombre">Facturado</span></div>
        <div class="cifra"><span class="cifra-valor" ${debe ? 'style="color:var(--error)"' : ''}>${plata(debe)}</span><span class="cifra-nombre">Saldo a cobrar</span></div>
      </div>

      <form id="formCliente" novalidate>
        <section class="bloque">
          <h2>Datos</h2>
          ${campoTexto('nombre', 'Nombre y apellido', c.nombre)}
          <div class="fila">
            ${campoTelefono('f_telefono', 'Teléfono', c.telefono)}
            <div class="campo"><label for="f_email">Email</label><input type="email" id="f_email" name="email" value="${esc(c.email)}"></div>
          </div>
          ${campoSelect('origen', '¿Cómo te encontró?', c.origen || origenCliente(c), ['', ...ORIGENES])}
          ${campoArea('notas', 'Notas', c.notas, 'Ej.: prefiere que le escriban, tiene factura A a nombre de su empresa.')}
        </section>
      </form>

      <h2 style="font-size:1.15rem;margin:22px 0 10px">Órdenes</h2>
      <div class="lista">${ords.length ? ords.map(tarjetaOrden).join('') : '<div class="vacio">Todavía no tiene órdenes.</div>'}</div>
      ${rems.length ? `<h2 style="font-size:1.15rem;margin:22px 0 10px">Asistencias remotas</h2><div class="lista">${rems.map(tarjetaRemota).join('')}</div>` : ''}
    </div>`;

  const form = $('formCliente');
  form.addEventListener('input', () => marcarSucio(true));
  form.addEventListener('submit', (e) => { e.preventDefault(); if (guardarActual) guardarActual(); });
  guardarActual = async () => {
    try {
      const leidos = { ...leerFormulario(form), telefono: leerTelefono('f_telefono') };
      const cambios = diferencias(leidos, c);
      if (!Object.keys(cambios).length) { marcarSucio(false); return; }
      const nuevo = { ...c, ...cambios };
      if (!nuevo.nombre) throw new Error('Falta el nombre del cliente.');
      if (numeroTelefono('f_telefono').length < 6) throw new Error('Falta el teléfono (al menos 6 números, sin el código de país).');
      const repetido = DB.clientes.find((x) => x.id !== c.id && digitos(x.telefono).slice(-8) === digitos(nuevo.telefono).slice(-8));
      if (repetido) throw new Error(`Ese teléfono ya es de ${repetido.nombre}.`);
      reemplazar(DB.clientes, 'id', nuevo);
      DB.ordenes.forEach((o) => { if (o.cliente_id === c.id) { o.cliente = nuevo.nombre; o.telefono = nuevo.telefono; } });
      marcarSucio(false);
      avisar('Cliente guardado');
      refrescarVista();
      encolar({
        clave: 'cliente:' + c.id,
        accion: 'actualizarCliente',
        datos: { id: c.id, cambios },
        alTerminar: (r) => { reemplazar(DB.clientes, 'id', r.cliente); }
      });
    } catch (e) {
      avisar(e.message, true);
    }
  };
}

              ${chip('Cargador')}${chip('Cable de alimentación')}${chip('Funda o bolso')}${chip('Mouse')}${chip('Teclado')}${chip('Pendrive o disco externo', 'Pendrive o disco')}
            </div>

          <div class="campo"><label for="eAccOtros">Otros accesorios <span class="opcional">(opcional)</span></label><input type="text" id="eAccOtros" placeholder="Monitor, parlantes, adaptador HDMI…"></div>
        </section>

        <section class="bloque">
          <h2>El trabajo</h2>
          <div class="campo"><label for="tFalla">Falla que cuenta el cliente</label><textarea id="tFalla" placeholder="Anda muy lenta y se apaga sola después de un rato."></textarea></div>
        </section>

        <section class="bloque revision">
          <h2>Cómo llega el equipo</h2>
          <p class="nota">Sale en el comprobante ${tip('Todo lo que marques en esta sección aparece en el comprobante de ingreso que firma el cliente.')}</p>
          <div class="chips" id="estadoIngreso">
            ${chip('No enciende')}${chip('Pantalla rota o marcada')}${chip('Carcasa golpeada o rayada')}${chip('Bisagras flojas o rotas')}${chip('Faltan teclas')}${chip('Faltan tornillos o tapas')}${chip('Signos de líquido derramado', 'Signos de líquido')}${chip('Abierto o reparado antes')}
          </div>
          <div class="campo" style="margin-top:14px"><label for="tObs">Observaciones <span class="opcional">(opcional)</span></label><textarea id="tObs" placeholder="Ej.: rayón en la tapa, esquina inferior izquierda."></textarea></div>
        </section>

        <div class="mensaje error" id="errorIngreso" role="alert" hidden></div>
        <button class="btn btn-principal" type="submit" id="btnGuardar">Guardar y abrir la orden</button>
      </form>
    </div>`;

  let modo = 'nuevo';
  let elegido = null;
  const form = $('formIngreso');
  form.addEventListener('input', () => marcarSucio(true, false));

  const cambiarModo = (m) => {
    modo = m;
    form.querySelectorAll('.segmento button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.modo === m)));
    $('clienteNuevo').hidden = m !== 'nuevo';
    $('clienteExistente').hidden = m !== 'existente';
    if (m === 'existente' && !elegido) setTimeout(() => $('cBuscar').focus(), 50);
  };
  const elegir = (c) => {
    elegido = c;
    $('cElegidoNombre').textContent = c.nombre;
    $('cElegidoTel').textContent = mostrarTel(c.telefono);
    $('cElegido').hidden = false;
    $('buscadorCliente').hidden = true;
    $('cResultados').innerHTML = '';
  };
  form.querySelectorAll('.segmento button').forEach((b) => b.addEventListener('click', () => cambiarModo(b.dataset.modo)));
  $('cCambiar').onclick = () => { elegido = null; $('cElegido').hidden = true; $('buscadorCliente').hidden = false; $('cBuscar').value = ''; $('cBuscar').focus(); };

  $('cBuscar').addEventListener('input', () => {
    const q = normalizar($('cBuscar').value.trim());
    const qd = digitos(q);
    const ul = $('cResultados');
    ul.innerHTML = '';
    if (q.length < 2) return;
    const res = DB.clientes.filter((c) => normalizar(c.nombre).includes(q) || (qd.length >= 3 && digitos(c.telefono).includes(qd))).slice(0, 12);
    if (!res.length) { ul.innerHTML = '<li><button type="button" disabled>Sin resultados. Cargalo como cliente nuevo.</button></li>'; return; }
    res.forEach((c) => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.innerHTML = esc(c.nombre) + '<small>' + esc(mostrarTel(c.telefono)) + '</small>';
      b.onclick = () => elegir(c);
      li.appendChild(b);
      ul.appendChild(li);
    });
  });

  if (preCliente) { cambiarModo('existente'); elegir(preCliente); }

  conectarBotonFoto('ingFoto', (campo, valor) => {
    const donde = { marca: 'eMarca', modelo: 'eModelo', serie: 'eSerie' }[campo];
    if (donde && $(donde)) $(donde).value = valor;
  });

  const marcados = (id) => [...document.querySelectorAll('#' + id + ' input:checked')].map((i) => i.value);
  const error = (msg, campo) => { $('errorIngreso').textContent = msg; $('errorIngreso').hidden = !msg; if (campo) $(campo).focus(); };

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    error('');
    const accesorios = marcados('accesorios');
    if ($('eAccOtros').value.trim()) accesorios.push($('eAccOtros').value.trim());
    const datos = {
      cliente: modo === 'existente'
        ? { modo: 'existente', id: elegido && elegido.id }
        : { modo: 'nuevo', nombre: $('cNombre').value.trim(), telefono: leerTelefono('cTelefono'), email: $('cEmail').value.trim(), origen: leerChipsOrigen('tOrigen') },
      equipo: { tipo: $('eTipo').value, marca: $('eMarca').value.trim(), modelo: $('eModelo').value.trim(), serie: $('eSerie').value.trim(), clave: $('eClave').value.trim() },
      accesorios,
      falla: $('tFalla').value.trim(),
      estadoIngreso: marcados('estadoIngreso'),
      observaciones: $('tObs').value.trim()
    };

    if (datos.cliente.modo === 'existente' && !datos.cliente.id) return error('Elegí el cliente de la lista.', 'cBuscar');
    if (datos.cliente.modo === 'nuevo' && !datos.cliente.nombre) return error('Falta el nombre del cliente.', 'cNombre');
    if (datos.cliente.modo === 'nuevo' && numeroTelefono('cTelefono').length < 6) return error('Falta el teléfono del cliente (al menos 6 números, sin el código de país).', 'cTelefono');
    if (!datos.equipo.tipo) return error('Elegí el tipo de equipo.', 'eTipo');
    if (!datos.falla) return error('Anotá la falla que cuenta el cliente.', 'tFalla');

    const b = $('btnGuardar');
    b.disabled = true; b.textContent = 'Guardando…';
    const lento = setTimeout(() => { b.textContent = 'Guardando… la planilla está tardando'; }, 6000);
    const conocidas = new Set(DB.ordenes.map((o) => o.numero));
    try {
      const r = await api('crearOrden', { datos }, 25000);
      if (r.cliente) reemplazar(DB.clientes, 'id', r.cliente);
      reemplazar(DB.ordenes, 'numero', r.orden);
      marcarSucio(false);
      vistaOrdenCreada(r.orden);
    } catch (e) {
      if (!e.rechazado && !e.sesion) {
        clearTimeout(lento);
        b.textContent = 'Verificando en la planilla…';
        const tel = digitos(datos.cliente.telefono).slice(-8);
        const o = await verificarCreacion(() => DB.ordenes.find((x) =>
          !conocidas.has(x.numero) && x.falla.trim() === datos.falla &&
          (datos.cliente.modo === 'existente' ? x.cliente_id === datos.cliente.id : digitos(x.telefono).slice(-8) === tel)));
        if (o) { marcarSucio(false); vistaOrdenCreada(o); return; }
        error('No pude confirmar si se guardó. Antes de reintentar, fijate en Órdenes si ya se creó, para no duplicarla.');
      } else {
        error(e.message || 'No se pudo guardar la orden.');
      }
      b.disabled = false; b.textContent = 'Guardar y abrir la orden';
    } finally {
      clearTimeout(lento);
    }
  });
}

      <a class="cifra" href="#presupuestos/sin-armar"><span class="cifra-valor">${sinArmar.length}</span><span class="cifra-nombre">Equipos para presupuestar</span></a>

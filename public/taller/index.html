let busquedaCatalogo = '';
let filtroCatalogo = 'todos';

function vistaCatalogo() {
  let lista = ordenarCatalogo(DB.catalogo).map((c) => ({ ...c }));
  const contar = (t) => lista.filter((c) => tipoCat(c) === t).length;

  $('contenido').innerHTML = `
    <div class="cab-vista">
      <div><h1>Servicios y hardware ${tip('El precio es de referencia: cuando armás el presupuesto lo podés cambiar sin tocar esta lista. El hardware suele ir sin precio, porque cambia seguido. Lo que marques como oculto no aparece al presupuestar, pero no se borra.')}</h1><p class="bajada">Lo que podés sumar a un presupuesto con un toque.</p></div>
      <div class="botones-fila" style="flex:0 1 auto">
        <button class="btn btn-secundario btn-auto" type="button" id="catNuevoServicio">${ICONO.servicio} Agregar servicio</button>
        <button class="btn btn-principal btn-auto" type="button" id="catNuevoHardware">${ICONO.hardware} Agregar hardware</button>
      </div>
    </div>

    <div class="filtros">
      <input type="search" id="catBuscar" placeholder="Buscar por nombre o detalle" value="${esc(busquedaCatalogo)}" aria-label="Buscar en la lista">
      <select id="catFiltro" aria-label="Filtrar">
        <option value="todos" ${filtroCatalogo === 'todos' ? 'selected' : ''}>Todos (${lista.length})</option>
        <option value="Servicio" ${filtroCatalogo === 'Servicio' ? 'selected' : ''}>Servicios (${contar('Servicio')})</option>
        <option value="Hardware" ${filtroCatalogo === 'Hardware' ? 'selected' : ''}>Hardware (${contar('Hardware')})</option>
        <option value="inactivos" ${filtroCatalogo === 'inactivos' ? 'selected' : ''}>Ocultos en presupuestos</option>
      </select>
    </div>


    <div class="tabla-cat" id="catLista"></div>
    <p class="contador" id="catContador" style="margin-top:12px"></p>`;

  const visibles = () => {
    const q = normalizar(busquedaCatalogo.trim());
    return lista
      .map((c, i) => ({ c, i }))
      .filter(({ c }) => {
        if (filtroCatalogo === 'inactivos') return !activoCat(c);
        if (filtroCatalogo !== 'todos' && tipoCat(c) !== filtroCatalogo) return false;
        return true;
      })
      .filter(({ c }) => !q || normalizar(`${c.nombre} ${c.detalle || ''}`).includes(q));
  };

  const pintar = () => {
    const filas = visibles();
    $('catLista').innerHTML = filas.length ? `
      <div class="cat-cab"><span>Nombre</span><span>Tipo</span><span>Precio</span><span>Detalle</span><span></span></div>
      ${filas.map(({ c, i }) => `
        <div class="cat-fila ${activoCat(c) ? '' : 'inactivo'}" data-i="${i}">
          <input type="text" class="cat-nombre" value="${esc(c.nombre || '')}" placeholder="Nombre" aria-label="Nombre">
          <div class="tipo-sel" role="group" aria-label="Tipo">${TIPOS_CAT.map((t) => `<button type="button" class="tipo-op ${tipoCat(c) === t ? 'elegido' : ''}" data-tipo="${t}" title="${t}" aria-label="${t}" aria-pressed="${tipoCat(c) === t}">${t === 'Servicio' ? ICONO.servicio : ICONO.hardware}</button>`).join('')}</div>
          <input type="text" class="cat-precio" inputmode="numeric" value="${esc(formatearPlata(c.precio))}" placeholder="A cotizar" aria-label="Precio">
          <input type="text" class="cat-detalle" value="${esc(c.detalle || '')}" placeholder="Medida, modelo, aclaración…" aria-label="Detalle">
          <span class="cat-acciones">
            <button type="button" class="cat-btn" data-activo="${i}" title="${activoCat(c) ? 'Ocultar en los presupuestos' : 'Mostrar en los presupuestos'}" aria-label="${activoCat(c) ? 'Ocultar' : 'Mostrar'}">${activoCat(c) ? ICONO.ojo : ICONO.ojoNo}</button>
            <button type="button" class="cat-btn borrar" data-borrar="${i}" title="Borrar" aria-label="Borrar">×</button>
          </span>
        </div>`).join('')}`
      : '<div class="vacio">No hay nada con ese filtro.</div>';
    $('catContador').textContent = `${filas.length} de ${lista.length} ${pl(lista.length, 'ítem', 'ítems')}`;
  };
  pintar();

  const tocar = () => marcarSucio(true, true);
  const agregar = (tipo) => {
    lista.unshift({ id: '', nombre: '', tipo, precio: '', detalle: '', activo: 'Sí' });
    filtroCatalogo = 'todos'; busquedaCatalogo = '';
    $('catBuscar').value = ''; $('catFiltro').value = 'todos';
    pintar();
    const primero = $('catLista').querySelector('.cat-fila .cat-nombre');
    if (primero) primero.focus();
    tocar();
  };
  $('catNuevoServicio').onclick = () => agregar('Servicio');
  $('catNuevoHardware').onclick = () => agregar('Hardware');
  $('catBuscar').addEventListener('input', (e) => { busquedaCatalogo = e.target.value; pintar(); });
  $('catFiltro').addEventListener('change', (e) => { filtroCatalogo = e.target.value; pintar(); });

  $('catLista').addEventListener('input', (e) => {
    const fila = e.target.closest('.cat-fila');
    if (!fila) return;
    const c = lista[Number(fila.dataset.i)];
    if (e.target.classList.contains('cat-nombre')) c.nombre = e.target.value;
    if (e.target.classList.contains('cat-precio')) c.precio = digitos(e.target.value);
    if (e.target.classList.contains('cat-detalle')) c.detalle = e.target.value;
    tocar();
  });
  $('catLista').addEventListener('click', (e) => {
    const tipo = e.target.closest('[data-tipo]');
    const borrar = e.target.closest('[data-borrar]');
    const activo = e.target.closest('[data-activo]');
    if (tipo) {
      lista[Number(tipo.closest('.cat-fila').dataset.i)].tipo = tipo.dataset.tipo;
      pintar(); tocar();
    } else if (borrar) {
      const c = lista[Number(borrar.dataset.borrar)];
      if (c.nombre && !confirm(`¿Borrar "${c.nombre}" de la lista?`)) return;
      lista.splice(Number(borrar.dataset.borrar), 1);
      pintar(); tocar();
    } else if (activo) {
      const c = lista[Number(activo.dataset.activo)];
      c.activo = activoCat(c) ? 'No' : 'Sí';
      pintar(); tocar();
    }
  });

  guardarActual = async () => {
    const limpia = lista.filter((c) => String(c.nombre || '').trim());
    try {
      const r = await api('guardarCatalogo', { lista: limpia }, 25000);
      DB.catalogo = r.catalogo || limpia;
      guardarDBLocal();
      marcarSucio(false);
      avisar('Lista guardada');
      vistaCatalogo();
    } catch (e) {
      avisar(e.message, true);
    }
  };
}

          ${campoTexto('responsable', 'Responsable', CONFIG.responsable || '')}
        </div>
        <div class="fila">
          ${campoTexto('firma_whatsapp', 'Cómo firmás los mensajes', CONFIG.firmaWhatsapp || '')}
          ${campoTexto('whatsapp', 'WhatsApp', CONFIG.whatsapp || '')}
        </div>
        <div class="fila">
          ${campoTexto('email', 'Email', CONFIG.email || '')}
          ${campoTexto('web', 'Web', CONFIG.web || '')}

        ${campoTexto('link_resenas', 'Link para dejar una reseña en Google', CONFIG.linkResenas || '')}`)
        , '', 'Se usan en el comprobante, en los mensajes de WhatsApp, en las imágenes que le mandás al cliente y en su link de seguimiento.')}

      ${bloquePlega('horario', ICONO.reloj, 'Horario de atención', `
        <div class="lectura">
          <div class="datos"><div class="dato"><span>Al cliente le va a decir</span><b id="cfHorarioTexto">${esc(textoHorario())}</b></div></div>

          ${campoTexto('horario_nota', 'Aclaración <span class="opcional">(opcional)</span>', aj('horario_nota'))}
          <button class="btn btn-secundario btn-auto" type="button" data-listo="horario" style="margin-top:14px">Listo</button>
        </div>
        `, '', 'Día por día, con los tramos que necesites: por ejemplo, de 7 a 12 y de 14 a 18. Sirve para dos cosas: el recargo de la asistencia remota y el horario que le decís al cliente cuando viene a retirar el equipo.')}

      ${bloquePlega('laboratorio', ICONO.laboratorio, 'Demora del laboratorio', conLectura('laboratorio', `
        <div class="fila">
          ${campoContador('lab_dias_min', 'Mínimo (días hábiles)', aj('lab_dias_min'))}
          ${campoContador('lab_dias_max', 'Máximo (días hábiles)', aj('lab_dias_max'))}
        </div>`)
        , '', 'Los días hábiles que suele tardar el laboratorio externo. Con esto la app calcula cuándo esperar el equipo y te avisa si se pasó del plazo.')}

      ${bloquePlega('google', ICONO.candado, 'Entrar con Google', conLectura('google', `
        <p class="ayuda" style="margin:0 0 12px">El ID se saca gratis en <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">console.cloud.google.com</a> → Crear credenciales → ID de cliente de OAuth → Aplicación web, agregando <b>https://${esc(CONFIG.web || 'revivitucompu.com.ar')}</b> en "Orígenes autorizados de JavaScript".</p>
        ${campoTexto('google_client_id', 'ID de cliente de OAuth', aj('google_client_id'), 'spellcheck="false" autocomplete="off" placeholder="1234567890-abcdef.apps.googleusercontent.com"')}
        ${campoArea('google_emails', 'Correos de Google que pueden entrar', aj('google_emails'), 'juan@gmail.com; otro@gmail.com')}
        <p class="ayuda" style="margin:-6px 0 0">Separados por punto y coma. Cualquier otra cuenta queda afuera, aunque tenga el link.</p>`)
        , '', 'En vez de usuario y contraseña, el acceso se hace con una cuenta de Google. Solo entran los correos que cargues acá: la app le pide a Google que confirme quién es, y el Apps Script chequea que esté en la lista. El usuario y la contraseña siguen funcionando igual, por si alguna vez no hay Google a mano.')}

      ${bloquePlega('foto', ICONO.camara, 'Leer la foto del equipo', `
        <div class="lectura">
          <div class="datos"><div class="dato"><span>Estado</span><b style="color:${conGemini ? '#17865A' : 'var(--tinta-suave)'}">${conGemini ? 'Clave cargada' : 'Sin configurar'}</b></div></div>
          <div class="botones-fila" style="margin-top:14px">
            <button class="btn-editar" type="button" data-editar="foto" style="margin:0">${ICONO.lapiz} ${conGemini ? 'Cambiar la clave' : 'Cargar la clave'}</button>
            ${conGemini ? '<button class="btn-editar" type="button" id="cfProbarFoto" style="margin:0">Probar la clave</button>' : ''}
          </div>
          <p class="ayuda" style="margin:10px 0 0" id="cfFotoEstado"></p>
        </div>
        <div class="edicion">
          <p class="ayuda" style="margin:0 0 12px">La clave se saca gratis en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con tu misma cuenta de Google.</p>
          <div class="campo">
            <label for="f_gemini_key">Clave de Google Gemini</label>
            <input type="password" id="f_gemini_key" name="gemini_key" value="" autocomplete="off" spellcheck="false" placeholder="${conGemini ? 'Ya está cargada: escribí una nueva para cambiarla' : 'Pegá la clave acá'}">
          </div>
          <div class="botones-fila">
            <button class="btn btn-secundario" type="button" data-listo="foto">Listo</button>
            ${conGemini ? '<button class="btn btn-secundario" type="button" id="cfBorrarClave">Borrar la clave</button>' : ''}
          </div>
        </div>
        `, '', 'Con esto podés sacarle una foto a la etiqueta del equipo y que la marca, el modelo y el número de serie se completen solos. La clave se guarda en tu planilla y la usa tu Apps Script: nunca viaja al navegador.')}

      ${bloquePlega('catalogo', ICONO.servicio, 'Servicios y hardware', `
        <p class="ayuda" style="margin:0 0 12px">Lo que podés sumar a un presupuesto con un toque. Marcas de equipos guardadas: ${marcas.length}.</p>
        <a class="btn btn-secundario btn-auto" href="#catalogo">${ICONO.servicio} Editar la lista</a>`)}

      ${bloquePlega('datos', ICONO.descargar, 'Datos y copia local', `
        <p class="ayuda" style="margin:0 0 12px">Última actualización: <b>${DB.cargadoEn ? esc(new Date(DB.cargadoEn).toLocaleString('es-AR')) : '—'}</b> · ${DB.ordenes.length} ${pl(DB.ordenes.length, 'orden', 'órdenes')}, ${DB.clientes.length} ${pl(DB.clientes.length, 'cliente', 'clientes')}, ${DB.remotas.length} ${pl(DB.remotas.length, 'asistencia', 'asistencias')}, ${DB.citas.length} ${pl(DB.citas.length, 'cita', 'citas')}.</p>
        <div class="botones-fila">
          <button class="btn btn-secundario" type="button" id="cfActualizar">Actualizar datos ahora</button>
          <button class="btn btn-secundario" type="button" id="cfExportar">${ICONO.descargar} Exportar</button>
          <button class="btn btn-secundario" type="button" id="cfImportar">${ICONO.subirArchivo} Importar</button>
          <input type="file" id="cfArchivo" accept="application/json,.json" hidden>
        </div>
        <p class="ayuda" style="margin:10px 0 0">Exportar baja un archivo con todo (clientes, órdenes, asistencias, citas, servicios y ajustes). Importar suma lo que falte y actualiza lo que ya exista: nunca borra nada.</p>
        <button class="btn btn-secundario btn-auto" type="button" id="cfLimpiar" style="margin-top:12px">Borrar la copia de este dispositivo</button>
        `, '', 'La app guarda en este dispositivo una copia de los datos para abrir rápido. La planilla de Google es siempre la fuente real. Guardá el archivo exportado en tu compu o en Drive: es tu respaldo.')}

    </form>

    <div class="botones">
      <a class="btn btn-secundario" href="#acerca">Acerca de esta app</a>
    </div>`;

  const form = $('formConfig');
  const base = { ...AJUSTES_DEF, ...(DB.ajustes || {}) };

  /* ── Horario de atención: un día por fila, con los tramos que haga falta ── */
  const dias = { ...horario };
  const pintarHorario = () => {
    $('horarioEditor').innerHTML = SEMANA.map((d) => {
      const tramos = dias[d] || [];
      const cerrado = !tramos.length;
      return `<div class="hdia ${cerrado ? 'cerrado' : ''}" data-dia="${d}">
        <div class="hdia-dia">
          <b>${DIAS_NOMBRE[d].charAt(0).toUpperCase() + DIAS_NOMBRE[d].slice(1)}</b>
          <label class="hdia-cerrado"><input type="checkbox" data-cerrado="${d}" ${cerrado ? 'checked' : ''}><span>Cerrado</span></label>
        </div>
        <div class="hdia-tramos">
          ${cerrado ? '<p class="hdia-sin">Sin atención</p>' : tramos.map(([a, b], i) => `
            <div class="hdia-tramo">
              <div class="campo"><label for="h${d}_${i}_a">Abre</label><input type="text" class="hora" inputmode="numeric" maxlength="5" autocomplete="off" id="h${d}_${i}_a" data-h="0" data-dia="${d}" data-i="${i}" value="${aHoraTexto(a)}"></div>
              <div class="campo"><label for="h${d}_${i}_b">Cierra</label><input type="text" class="hora" inputmode="numeric" maxlength="5" autocomplete="off" id="h${d}_${i}_b" data-h="1" data-dia="${d}" data-i="${i}" value="${aHoraTexto(b)}"></div>
              <button type="button" class="hdia-btn" data-quitar-tramo="${d}:${i}" title="Quitar este horario" aria-label="Quitar este horario" ${tramos.length > 1 ? '' : 'disabled'}>×</button>
            </div>`).join('')}
        </div>
        <div class="hdia-acciones">
          ${cerrado ? '' : `<button type="button" class="hdia-btn" data-mas="${d}" title="Agregar otro horario ese día" aria-label="Agregar otro horario">+</button>
          <button type="button" class="hdia-btn" data-copiar="${d}" title="Copiar este horario a los demás días abiertos" aria-label="Copiar a los demás días">${ICONO.copiar}</button>`}
        </div>
      </div>`;
    }).join('');
    repasarHorario();
  };
  // Solo recalcula el valor que se guarda y el texto que ve el cliente, sin volver a dibujar
  function repasarHorario() {
    $('f_horario').value = horarioATexto(dias);
    const previos = DB.ajustes;
    DB.ajustes = { ...base, horario: $('f_horario').value, horario_nota: form.horario_nota.value };
    const texto = textoHorario();
    $('cfHorarioTexto').textContent = texto || 'cerrado todos los días';
    $('cfHorarioResumen').textContent = texto || 'cerrado todos los días';
    DB.ajustes = previos;
  }
  pintarHorario();

  form.addEventListener('click', (e) => {
    const cont = e.target.closest('[data-cont]');
    if (cont) {
      const campo = form.elements[cont.dataset.para];
      const min = Number(campo.dataset.min) || 1, max = Number(campo.dataset.max) || 365;
      campo.value = String(Math.min(max, Math.max(min, (Number(digitos(campo.value)) || min) + Number(cont.dataset.cont))));
      form.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    const mas = e.target.closest('[data-mas]');
    if (mas) {
      const d = Number(mas.dataset.mas);
      const ult = dias[d][dias[d].length - 1];
      const desde = Math.min(1380, ult[1] + 60);
      dias[d] = [...dias[d], [desde, Math.min(1440, desde + 180)]];
      pintarHorario(); marcarSucio(true);
      return;
    }
    const quitar = e.target.closest('[data-quitar-tramo]');
    if (quitar) {
      const [d, i] = quitar.dataset.quitarTramo.split(':').map(Number);
      dias[d] = dias[d].filter((x, k) => k !== i);
      pintarHorario(); marcarSucio(true);
      return;
    }
    const copiar = e.target.closest('[data-copiar]');
    if (copiar) {
      const d = Number(copiar.dataset.copiar);
      SEMANA.forEach((x) => { if (x !== d && (dias[x] || []).length) dias[x] = dias[d].map((t) => [...t]); });
      pintarHorario(); marcarSucio(true);
      avisar('Horario copiado a los demás días abiertos');
    }
  });
  $('horarioEditor').addEventListener('change', (e) => {
    const cerrado = e.target.closest('[data-cerrado]');
    if (!cerrado) return;
    const d = Number(cerrado.dataset.cerrado);
    if (cerrado.checked) delete dias[d];
    else dias[d] = [[600, 1140]];
    pintarHorario(); marcarSucio(true);
  });
  // Mientras escribís se va guardando lo que ya sea una hora válida
  $('horarioEditor').addEventListener('input', (e) => {
    const hora = e.target.closest('[data-h]');
    if (!hora) return;
    const v = aMinutosHora(hora.value);
    if (v === null) return;
    dias[Number(hora.dataset.dia)][Number(hora.dataset.i)][Number(hora.dataset.h)] = v;
    repasarHorario(); marcarSucio(true);
  });
  // Al salir del campo se acomoda: si quedó al revés, se corre la otra punta una hora
  $('horarioEditor').addEventListener('blur', (e) => {
    const hora = e.target.closest('[data-h]');
    if (!hora) return;
    const d = Number(hora.dataset.dia), i = Number(hora.dataset.i), k = Number(hora.dataset.h);
    const v = aMinutosHora(hora.value);
    if (v === null) { hora.value = aHoraTexto(dias[d][i][k]); return; }   // lo que no se entiende, vuelve a lo anterior
    dias[d][i][k] = v;
    if (dias[d][i][1] <= dias[d][i][0]) {
      dias[d][i][1 - k] = k === 0 ? Math.min(1439, v + 60) : Math.max(0, v - 60);
      const otro = form.querySelector(`[data-dia="${d}"][data-i="${i}"][data-h="${1 - k}"]`);
      if (otro) otro.value = aHoraTexto(dias[d][i][1 - k]);
    }
    hora.value = aHoraTexto(dias[d][i][k]);
    repasarHorario(); marcarSucio(true);
  }, true);

  /* ── Lo que se lee con los bloques cerrados ── */
  const repintarConfig = () => {
    pintarDatosForm(form, DATOS_CONFIG);
    repasarHorario();
    const cal = form.calendario_id.selectedOptions[0];
    const res = {
      remota: `${plata(num(parsePlata(form.valor_hora.value)))} la hora · +${Number(form.remoto_recargo.value) || 0}% fuera de horario`,
      agenda: form.agenda.value === 'google' ? `Google Calendar: ${cal ? cal.textContent : 'el principal'}` : 'Solo en esta app',
      negocio: [form.negocio.value.trim(), form.whatsapp.value.trim()].filter(Boolean).join(' · ') || 'Sin cargar',
      horario: textoHorarioAhora() || 'cerrado todos los días',
      laboratorio: `entre ${form.lab_dias_min.value} y ${form.lab_dias_max.value} días hábiles`,
      google: conGoogleAhora(),
      foto: conGemini ? 'Clave cargada' : 'Sin configurar',
      catalogo: `${servicios} ${pl(servicios, 'servicio', 'servicios')} y ${hardware} de hardware`,
      datos: DB.cargadoEn ? 'Actualizado el ' + new Date(DB.cargadoEn).toLocaleString('es-AR') : 'Sin copia local'
    };
    Object.entries(res).forEach(([k, v]) => {
      const e = form.querySelector(`[data-res="${k}"]`);
      if (e) e.textContent = v;
    });
  };
  const conGoogleAhora = () => {
    const correos = String(form.google_emails.value || '').split(/[;,\s]+/).filter(Boolean).length;
    return form.google_client_id.value.trim() && correos
      ? `Activo · ${correos} ${pl(correos, 'correo', 'correos')}`
      : 'Sin configurar';
  };
  const textoHorarioAhora = () => {
    const previos = DB.ajustes;
    DB.ajustes = { ...base, horario: horarioATexto(dias), horario_nota: form.horario_nota.value };
    const t = textoHorario();
    DB.ajustes = previos;
    return t;
  };

  const plegables = conectarPlegables(form, abiertosConfig, repintarConfig);
  repintarConfig();
  if (configPendiente) {
    plegables.editar(configPendiente.bloque, configPendiente.campo);
    const sec = form.querySelector(`.plega[data-b="${configPendiente.bloque}"]`);
    if (sec) sec.scrollIntoView({ block: 'center' });
    configPendiente = null;
  }

  form.addEventListener('input', (e) => {
    if (e.target.dataset && e.target.dataset.pct) {
      const salida = form.querySelector(`output[for="${e.target.id}"]`);
      if (salida) salida.textContent = e.target.value + '%';
    }
    repasarHorario(); marcarSucio(true);
  });
  form.addEventListener('change', () => {
    marcarSucio(true);
    $('cfCalendario').hidden = form.agenda.value !== 'google';
    repintarConfig();
  });
  form.addEventListener('submit', (e) => { e.preventDefault(); if (guardarActual) guardarActual(); });

  guardarActual = async () => {
    try {
      const datos = leerFormulario(form);
      if (!datos.horario) throw new Error('Dejaste todos los días cerrados: marcá al menos uno.');
      const pisado = SEMANA.find((d) => tramosSePisan(dias[d] || []));
      if (pisado !== undefined) throw new Error(`Los horarios del ${DIAS_NOMBRE[pisado]} se pisan entre sí.`);
      if (Number(datos.lab_dias_max) < Number(datos.lab_dias_min)) throw new Error('El máximo de días del laboratorio no puede ser menor que el mínimo.');
      const NUMERICOS_AJ = ['valor_hora', 'remoto_fraccion', 'remoto_recargo', 'lab_dias_min', 'lab_dias_max'];
      const cambios = {};
      Object.keys(datos).forEach((k) => {
        if (k === 'gemini_key') { if (datos[k]) cambios[k] = datos[k]; return; }
        const antes = base[k] === undefined || base[k] === null ? '' : base[k];
        if (NUMERICOS_AJ.includes(k)) {
          if (Number(datos[k] || 0) !== Number(antes || 0)) cambios[k] = String(Number(datos[k] || 0));
        } else if (String(datos[k]) !== String(antes)) {
          cambios[k] = datos[k];
        }
      });
      if (cambios.calendario_id !== undefined) {
        const op = $('f_calendario_id').selectedOptions[0];
        cambios.calendario_nombre = cambios.calendario_id ? (op ? op.textContent : '') : '';
      }
      if (!Object.keys(cambios).length) { marcarSucio(false); return; }
      const r = await api('guardarAjustes', { cambios }, 25000);
      DB.ajustes = r.ajustes;
      aplicarAjustes();
      guardarDBLocal();
      marcarSucio(false);
      avisar('Configuración guardada');
      vistaConfig();
    } catch (e) {
      avisar(e.message, true);
    }
  };

  // Probar la clave: le pregunta a Google qué modelos acepta y se queda con uno
  if ($('cfProbarFoto')) $('cfProbarFoto').onclick = async () => {
    const b = $('cfProbarFoto'), estado = $('cfFotoEstado');
    b.disabled = true; b.textContent = 'Probando…';
    estado.textContent = ''; estado.style.color = '';
    try {
      const r = await api('probarGemini', {}, 30000);
      estado.style.color = '#17865A';
      estado.textContent = `La clave anda. Leyendo las fotos con ${r.modelo}.`;
    } catch (e) {
      estado.style.color = 'var(--error)';
      estado.textContent = e.message;
    } finally {
      b.disabled = false; b.textContent = 'Probar la clave';
    }
  };

  if ($('cfBorrarClave')) $('cfBorrarClave').onclick = async () => {
    if (!confirm('Se borra la clave de Gemini y deja de funcionar la lectura de fotos. ¿Seguimos?')) return;
    try {
      const r = await api('guardarAjustes', { cambios: { gemini_key: '-' } }, 25000);
      DB.ajustes = r.ajustes; avisar('Clave borrada'); vistaConfig();
    } catch (e) { avisar(e.message, true); }
  };

  $('cfBuscarCal').onclick = async () => {
    const b = $('cfBuscarCal');
    b.disabled = true; b.textContent = 'Buscando…';
    try {
      const r = await api('listarCalendarios', {}, 25000);
      const sel = $('f_calendario_id');
      sel.innerHTML = `<option value="">El principal de tu cuenta</option>` +
        (r.calendarios || []).map((c) => `<option value="${esc(c.id)}" ${c.id === aj('calendario_id') ? 'selected' : ''}>${esc(c.nombre)}</option>`).join('');
      b.hidden = true;
      avisar(`${(r.calendarios || []).length} ${pl((r.calendarios || []).length, 'calendario', 'calendarios')}`);
    } catch (e) {
      avisar(e.message, true);
      b.disabled = false; b.textContent = 'Buscar mis calendarios';
    }
  };

  $('cfActualizar').onclick = async () => {
    const b = $('cfActualizar');
    b.disabled = true; b.textContent = 'Actualizando…';
    try { await cargarDatos(true); avisar('Datos actualizados'); vistaConfig(); }
    catch (e) { avisar(e.message, true); b.disabled = false; b.textContent = 'Actualizar datos ahora'; }
  };
  $('cfExportar').onclick = () => {
    const copia = {
      app: 'Reviví Taller', version: VERSION, fecha: new Date().toISOString(),
      clientes: DB.clientes, ordenes: DB.ordenes, remotas: DB.remotas, citas: DB.citas, catalogo: DB.catalogo, ajustes: DB.ajustes
    };
    const hoy = new Date();
    bajarBlob(new Blob([JSON.stringify(copia, null, 2)], { type: 'application/json' }),
      `taller ${hoy.getFullYear()}-${dos(hoy.getMonth() + 1)}-${dos(hoy.getDate())}.json`);
    avisar('Copia descargada');
  };
  $('cfImportar').onclick = () => $('cfArchivo').click();
  $('cfArchivo').addEventListener('change', async (e) => {
    const archivo = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!archivo) return;
    let copia;
    try { copia = JSON.parse(await archivo.text()); }
    catch (err) { return avisar('Ese archivo no es una copia válida.', true); }
    const cuenta = (l) => Array.isArray(l) ? l.length : 0;
    const resumen = `${cuenta(copia.clientes)} clientes, ${cuenta(copia.ordenes)} órdenes, ${cuenta(copia.remotas)} asistencias, ${cuenta(copia.citas)} citas y ${cuenta(copia.catalogo)} ítems`;
    if (!confirm(`El archivo trae ${resumen}.\n\nSe agrega lo que falte y se actualiza lo que ya exista. No se borra nada. ¿Importamos?`)) return;
    const b = $('cfImportar');
    b.disabled = true; b.textContent = 'Importando…';
    try {
      const r = await api('importar', { copia: {
        clientes: copia.clientes || [], ordenes: copia.ordenes || [], remotas: copia.remotas || [],
        citas: copia.citas || [], catalogo: copia.catalogo || []
      } }, 120000);
      await cargarDatos(true);
      avisar(`Listo: ${r.nuevos} nuevos y ${r.actualizados} actualizados`);
      vistaConfig();
    } catch (err) {
      avisar(err.message, true);
      b.disabled = false; b.innerHTML = `${ICONO.subirArchivo} Importar`;
    }
  });
  $('cfLimpiar').onclick = () => {
    if (!confirm('Se borra la copia guardada en este dispositivo y se vuelven a pedir los datos. ¿Seguimos?')) return;
    borrarDBLocal();
    location.reload();
  };
}

function vistaAcerca() {

/* ═════════ Citas de asistencia remota ═════════ */
const DURACION_CITA = 60;
const DURACIONES = [30, 45, 60, 90, 120];
const fechaHoraCita = (c) => parseFecha(`${c.fecha} ${c.hora}`);
const finCita = (c) => { const d = fechaHoraCita(c); return d ? new Date(d.getTime() + (num(c.duracion) || DURACION_CITA) * 60000) : null; };
const citaEnPie = (c) => c.estado === 'Programada' && !!finCita(c) && finCita(c) >= new Date();
const citasProximas = () => DB.citas.filter(citaEnPie).sort((a, b) => fechaHoraCita(a) - fechaHoraCita(b));
const ordenarCitas = (lista) => [...lista].sort((a, b) => (fechaHoraCita(b) || 0) - (fechaHoraCita(a) || 0));
function cuandoCita(c) {
  const d = fechaHoraCita(c);
  if (!d) return '';
  const dias = diasEntre(new Date(), d);
  const hora = c.hora + ' hs';
  if (dias === 0) return 'Hoy ' + hora;
  if (dias === 1) return 'Mañana ' + hora;
  if (dias === -1) return 'Ayer ' + hora;
  return c.fecha + ' · ' + hora;
}
const mensajeCita = (c) => `Hola ${String(c.cliente || '').trim().split(' ')[0]}, te confirmo la asistencia técnica remota para el ${c.fecha} a las ${c.hora} hs.` +

function tarjetaCita(c) {
  const enPie = citaEnPie(c);
  const color = c.estado === 'Cancelada' ? 'var(--tinta-suave)' : c.estado === 'Realizada' ? '#17865A' : enPie ? 'var(--acento-oscuro)' : 'var(--alerta)';
  const etiqueta = c.estado === 'Programada' ? (enPie ? cuandoCita(c) : 'Pasó sin cargar') : c.estado;
  return `<a class="tarjeta" href="#cita/${encodeURIComponent(c.id)}">

}

/* ═════════ Asistencia remota ═════════ */
const hhmm = (min) => `${Math.floor(min / 60)}:${dos(Math.round(min % 60))}`;
const pesos = (n) => '$' + Math.round(n || 0).toLocaleString('es-AR');
const factor = (u) => String(u).replace('.', ',');
const horaCorta = (h) => normalizarHora(h) || String(h || '');   // siempre HH:MM
const saldoRemota = (r) => Math.max(0, num(r.total) - num(r.cobrado));
const ordenarRemotas = (lista) => [...lista].sort((a, b) => Number(digitos(b.id)) - Number(digitos(a.id)));

function aMinutos(h) {
  const m = String(h || '').match(/^(\d{1,2}):(\d{2})$/);
  if (!m || Number(m[1]) > 23 || Number(m[2]) > 59) return null;
  return Number(m[1]) * 60 + Number(m[2]);
}
// Formato 24 hs mientras se escribe: "1310" → "13:10", "905" → "9:05"
function formatearHora(valor) {
  const d = String(valor || '').replace(/\D/g, '').slice(0, 4);
  return d.length <= 2 ? d : d.slice(0, -2) + ':' + d.slice(-2);
}
const normalizarHora = (h) => { const m = aMinutos(h); return m === null ? '' : `${dos(Math.floor(m / 60))}:${dos(m % 60)}`; };
function leerLapsos(texto) {
  return String(texto || '').split(';').map((x) => x.trim()).filter(Boolean).map((x) => {
    const [desde, hasta] = x.split('-').map((y) => y.trim());
    return { desde: desde || '', hasta: hasta || '' };
  });
}
// Horario normal: lunes a viernes de 10 a 19 hs. Los minutos que caen fuera de ese rango llevan recargo.
function diaSemana(fecha) {
  const m = String(fecha || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1])).getDay() : null;
}
function fueraDeHorario(dia, minuto) {
  const tramos = horarioRemoto().tramos[dia] || [];
  return !tramos.some(([a, b]) => minuto >= a && minuto < b);
}
// Cuenta, minuto a minuto, cuánto de un lapso cae fuera de horario (si pasa la medianoche, sigue en el día siguiente)
function minutosFueraDeHorario(dia, inicio, duracion) {
  if (dia === null) return 0;
  let n = 0;
  for (let i = 0; i < duracion; i++) {
    const t = inicio + i;
    if (fueraDeHorario((dia + Math.floor(t / 1440)) % 7, t % 1440)) n++;
  }
  return n;
}
function calcularRemota(lapsos, valorHora, fecha) {
  const dia = diaSemana(fecha);
  const detalle = lapsos.map((l) => {
    const a = aMinutos(l.desde), b = aMinutos(l.hasta);
    if (a === null || b === null) return { ...l, min: null, minFuera: 0 };
    let d = b - a;
    if (d < 0) d += 1440;
    return { ...l, min: d, minFuera: minutosFueraDeHorario(dia, a, d) };
  });
  const minutos = suma(detalle, (l) => l.min || 0);
  const minutosFuera = suma(detalle, (l) => l.minFuera || 0);
  const unidades = minutos <= 0 ? 0 : minutos <= 60 ? 1 : 1 + Math.ceil((minutos - 60) / 30) * 0.5;
  // Primera hora completa; después, lo que cueste cada media hora
  const fraccion = valorHora === valorHoraActual() ? fraccionRemota() : Math.round(valorHora / 2);
  const subtotal = minutos <= 0 ? 0 : Math.round(valorHora + (minutos <= 60 ? 0 : Math.ceil((minutos - 60) / 30) * fraccion));
  // El recargo se aplica sobre la parte del tiempo que cayó fuera de horario
  const recargo = minutos ? Math.round(subtotal * horarioRemoto().recargo * minutosFuera / minutos / 100) * 100 : 0;   // redondeado a $100
  return { detalle, minutos, minutosFuera, unidades, subtotal, recargo, total: subtotal + recargo };
}
const textoRecargo = (calc) => {
  const p = ajNum('remoto_recargo') + '%';
  return calc.minutosFuera >= calc.minutos ? p : `${p} de ${hhmm(calc.minutosFuera)} hs`;
};
/* Imagen JPG con el resumen de la asistencia, para mandar por WhatsApp */
function cargarImagen(src) {
  return new Promise((ok) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
}
function partirTexto(ctx, texto, ancho) {
  const lineas = [];
  String(texto || '').split(/\n/).forEach((parrafo) => {
    let linea = '';
    parrafo.split(/\s+/).filter(Boolean).forEach((p) => {
      const prueba = linea ? linea + ' ' + p : p;
      if (ctx.measureText(prueba).width > ancho && linea) { lineas.push(linea); linea = p; } else linea = prueba;
    });
    lineas.push(linea);
  });
  return lineas;
}
/* ── Copiar, descargar o compartir una imagen ── */
// Tres botones iguales en todos lados: enviar, copiar y descargar
const botoneraImagen = (pref, etiqueta) => `
  <div class="botones-fila">
    <button class="btn btn-principal" type="button" id="${pref}Enviar">${ICONO.wa} ${etiqueta}</button>

    <button class="btn btn-secundario" type="button" id="${pref}Bajar">${ICONO.descargar} Descargar imagen</button>
  </div>`;

function conectarBotonesImagen(pref, opciones) {
  const conEspera = (id, cargando, fn) => {
    const b = $(id);
    if (!b) return;
    const original = b.innerHTML;
    b.onclick = async () => {
      b.disabled = true; b.innerHTML = cargando;
      try { await fn(); }
      catch (e) { if (!e || e.name !== 'AbortError') avisar((e && e.message) || 'No se pudo armar la imagen.', true); }
      finally { b.disabled = false; b.innerHTML = original; }
    };
  };
  conEspera(pref + 'Enviar', 'Armando…', async () => {
    const lienzo = await opciones.lienzo();
    const texto = opciones.texto ? opciones.texto() : '';
    if (await compartirLienzo(lienzo, opciones.nombre(), texto)) return;
    // En la compu: la imagen queda copiada y se abre el chat con el texto
    let copiada = false;
    try { await copiarLienzo(lienzo); copiada = true; } catch (e) { await descargarLienzo(lienzo, opciones.nombre()); }
    const tel = opciones.telefono ? opciones.telefono() : '';
    if (telWa(tel).length >= 8) {
      window.open(linkWa(tel, texto), '_blank', 'noopener');
      avisar(copiada ? 'Imagen copiada: pegala en el chat que se abrió' : 'Imagen descargada: adjuntala en el chat que se abrió');
    } else {
      avisar('Falta el teléfono del cliente para abrir el chat.', true);
    }
  });
  conEspera(pref + 'Copiar', 'Copiando…', async () => { await copiarLienzo(await opciones.lienzo()); });
  conEspera(pref + 'Bajar', 'Descargando…', async () => { await descargarLienzo(await opciones.lienzo(), opciones.nombre()); });
}

const blobLienzo = (lienzo, tipo = 'image/jpeg') => new Promise((ok) => lienzo.toBlob(ok, tipo, tipo === 'image/jpeg' ? 0.92 : undefined));

function bajarBlob(blob, nombre) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function descargarLienzo(lienzo, nombre) {
  bajarBlob(await blobLienzo(lienzo), nombre);
  avisar('Imagen descargada');
}
async function copiarLienzo(lienzo) {
  if (!navigator.clipboard || !window.ClipboardItem) throw new Error('Este navegador no deja copiar imágenes. Usá "Descargar".');
  // Solo la imagen: si va con texto, WhatsApp la pega dos veces
  await navigator.clipboard.write([new ClipboardItem({ 'image/png': blobLienzo(lienzo, 'image/png') })]);
  avisar('Imagen copiada: pegala en el chat');
}
// El menú de compartir del sistema solo sirve en el celular: ahí está WhatsApp.
// En la compu (incluida la Mac) abre AirDrop, Mensajes y Notas, que no es lo que buscamos.
function esCelular() {
  const ua = navigator.userAgent || '';
  if (/Android|iPhone|iPod/i.test(ua)) return true;
  // El iPad moderno se hace pasar por Mac: lo delata la pantalla táctil
  return /Macintosh|Mac OS X/.test(ua) && navigator.maxTouchPoints > 1;
}
async function compartirLienzo(lienzo, nombre, texto) {
  if (!esCelular()) return false;
  const archivo = new File([await blobLienzo(lienzo)], nombre, { type: 'image/jpeg' });
  if (!(navigator.canShare && navigator.canShare({ files: [archivo] }))) return false;
  await navigator.share({ files: [archivo], text: texto });
  return true;
}

/* Arma una imagen (lienzo) con el formato de la marca: encabezado, tarjeta, secciones y total */
async function lienzoDoc(d) {
  try { await Promise.all(['700 44px "Archivo Narrow"', '400 30px "IBM Plex Sans"', '600 30px "IBM Plex Sans"'].map((f) => document.fonts.load(f))); } catch (e) { /* sigue con la fuente del sistema */ }
  const logo = await cargarImagen('/img/logo-horizontal.png');
  const W = 1080, M = 64, IN = 48;
  const TIT = '"Archivo Narrow", "Arial Narrow", sans-serif', TXT = '"IBM Plex Sans", system-ui, sans-serif';
  const C = { tinta: '#0E2230', suave: '#5A7183', linea: '#D9E6EF', fondo: '#F4F8FB', acento: '#29AAE3', oscuro: '#1583B5', verde: '#17865A' };

  const dibujar = (ctx) => {
    const x0 = M, x1 = W - M, ix0 = x0 + IN, ix1 = x1 - IN;
    const txt = (t, x, y, font, color, align) => { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.fillText(t, x, y); };
    ctx.fillStyle = C.fondo; ctx.fillRect(0, 0, W, 99999);

    let y = 56;
    if (logo) ctx.drawImage(logo, M, y, 330, 330 * logo.height / logo.width);
    txt(d.titulo, x1, y + 34, `700 34px ${TIT}`, C.oscuro, 'right');
    txt(d.referencia || '', x1, y + 78, `500 28px ${TXT}`, C.suave, 'right');
    y += 330 * (logo ? logo.height / logo.width : 0.4) + 44;

    const yTarjeta = y;
    ctx.save();
    ctx.shadowColor = 'rgba(14,34,48,.08)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x0, yTarjeta, x1 - x0, ctx._alto || 900, 24); ctx.fill();
    ctx.restore();
    ctx.fillStyle = C.acento; ctx.beginPath(); ctx.roundRect(x0, yTarjeta, x1 - x0, 10, [24, 24, 0, 0]); ctx.fill();

    y += 76;
    txt('Cliente', ix0, y, `500 26px ${TXT}`, C.suave);
    y += 48;
    txt(d.cliente || '—', ix0, y, `700 44px ${TIT}`, C.tinta);
    if (d.equipo) { y += 44; txt(d.equipo, ix0, y, `400 29px ${TXT}`, C.suave); }

    const separador = () => { y += 34; ctx.fillStyle = C.linea; ctx.fillRect(ix0, y, ix1 - ix0, 2); y += 54; };

    (d.secciones || []).filter((sx) => sx && (sx.texto || (sx.filas && sx.filas.length))).forEach((sx) => {
      separador();
      txt(sx.etiqueta, ix0, y, `500 26px ${TXT}`, C.suave);
      if (sx.texto) {
        ctx.font = `400 29px ${TXT}`;
        partirTexto(ctx, sx.texto, ix1 - ix0).forEach((l) => { y += 44; txt(l, ix0, y, `400 29px ${TXT}`, C.tinta); });
      }
      (sx.filas || []).forEach((f) => {
        y += 54;
        ctx.font = `400 30px ${TXT}`;
        const lineas = partirTexto(ctx, f.d, ix1 - ix0 - 220);
        lineas.forEach((l, k) => txt(l, ix0, y + k * 40, `400 30px ${TXT}`, C.tinta));
        if (f.v) txt(f.v, ix1, y, `600 30px ${TXT}`, C.tinta, 'right');
        y += (lineas.length - 1) * 40;
      });
    });

    if (d.total) {
      y += 40;
      const hTotal = 118;
      ctx.fillStyle = '#E3F3FB'; ctx.beginPath(); ctx.roundRect(ix0 - 16, y, ix1 - ix0 + 32, hTotal, 16); ctx.fill();
      txt(d.total.etiqueta, ix0 + 12, y + 74, `700 36px ${TIT}`, C.tinta);
      txt(d.total.valor, ix1 - 12, y + 80, `700 62px ${TIT}`, C.tinta, 'right');
      y += hTotal;
    }
    (d.notas || []).filter(Boolean).forEach((n, i) => {
      const fuente = `${n.fuerte ? '600' : '400'} ${n.fuerte ? 28 : 25}px ${TXT}`;
      y += i === 0 ? 50 : 42;
      ctx.font = fuente;
      // Las notas largas (garantía) se parten para no salirse de la tarjeta
      partirTexto(ctx, n.texto || n, ix1 - ix0).forEach((l, k) => {
        if (k) y += 36;
        txt(l, ix0, y, fuente, n.color || C.suave);
      });
    });
    y += 46;
    const altoTarjeta = y - yTarjeta;

    y += 56;
    txt(`WhatsApp ${CONFIG.whatsapp || ''}  ·  ${CONFIG.web || ''}`, W / 2, y, `500 27px ${TXT}`, C.tinta, 'center');
    if (d.pie) { y += 44; txt(d.pie, W / 2, y, `400 23px ${TXT}`, C.suave, 'center'); }
    y += 56;
    return { alto: y, altoTarjeta };
  };

  const prueba = document.createElement('canvas'); prueba.width = W; prueba.height = 4000;
  const med = dibujar(prueba.getContext('2d'));
  const lienzo = document.createElement('canvas'); lienzo.width = W; lienzo.height = Math.ceil(med.alto);
  const ctx = lienzo.getContext('2d'); ctx._alto = med.altoTarjeta;
  dibujar(ctx);
  return lienzo;
}

// Imagen del presupuesto
function imagenPresupuesto(o, items, total, diagnostico) {
  return lienzoDoc({
    titulo: 'PRESUPUESTO',
    referencia: `${o.numero} · ${hoyTexto()}`,
    cliente: o.cliente,
    equipo: descEquipo(o) || 'Equipo',
    secciones: [
      { etiqueta: 'Diagnóstico', texto: diagnostico },
      { etiqueta: 'Detalle', filas: items.length
        ? items.map((x) => ({ d: (x.c > 1 ? x.c + ' × ' : '') + x.d, v: pesos(x.c * x.p) }))
        : [{ d: 'Trabajo a realizar', v: pesos(total) }] }
    ],
    total: { etiqueta: 'Total', valor: pesos(total) },
    notas: ['El presupuesto vale por 7 días corridos. No incluye trabajos no detallados.'],
    pie: 'Diagnóstico y presupuesto sin cargo. Garantía de 3 meses sobre la mano de obra.'
  });
}

// Imagen del trabajo terminado, para mandar al entregar el equipo
function imagenEntrega(o, items) {
  const sinReparacion = o.estado === 'Sin reparación';
  const total = num(o.presupuesto);
  const cobrado = num(o.cobrado);
  const debe = num(o.reembolsado) > 0 ? 0 : Math.max(0, total - cobrado);
  return lienzoDoc({
    titulo: sinReparacion ? 'DIAGNÓSTICO' : 'TRABAJO REALIZADO',
    referencia: `${o.numero} · ${hoyTexto()}`,
    cliente: o.cliente,
    equipo: descEquipo(o) || 'Equipo',
    secciones: [
      { etiqueta: 'Falla que contaste', texto: o.falla },
      { etiqueta: 'Diagnóstico', texto: o.diagnostico },
      { etiqueta: sinReparacion ? 'Resultado' : 'Trabajo realizado', texto: sinReparacion ? (o.trabajo_realizado || 'El equipo no tiene reparación posible.') : o.trabajo_realizado },
      total || items.length ? { etiqueta: 'Detalle', filas: items.length
        ? items.map((x) => ({ d: (x.c > 1 ? x.c + ' × ' : '') + x.d, v: pesos(x.c * x.p) }))
        : [{ d: 'Trabajo realizado', v: pesos(total) }] } : null
    ],
    total: total ? { etiqueta: 'Total', valor: pesos(total) } : null,
    notas: [
      total && cobrado ? { texto: `Abonado: ${pesos(cobrado)}${o.medio_pago ? ' (' + o.medio_pago + ')' : ''}`, fuerte: true, color: '#17865A' } : null,
      debe ? { texto: `Saldo pendiente: ${pesos(debe)}`, fuerte: true, color: '#B42318' } : null,
      o.garantia_hasta ? `Mano de obra garantizada hasta el ${o.garantia_hasta}. En repuestos, según el componente.` : null,
      sinReparacion ? 'El diagnóstico no tiene costo.' : null
    ],
    pie: '¡Gracias por confiar en mí! Una reseña en Google me ayuda muchísimo.'
  });
}

async function imagenRemota(d) {
  // d: { id, fecha, cliente, calc, valorHora, detalle, cobrada, medio }
  try { await Promise.all(['700 44px "Archivo Narrow"', '400 30px "IBM Plex Sans"', '600 30px "IBM Plex Sans"', '700 30px "IBM Plex Sans"'].map((f) => document.fonts.load(f))); } catch (e) { /* sigue con la fuente del sistema */ }
  const logo = await cargarImagen('/img/logo-horizontal.png');
  const W = 1080, M = 64, IN = 48;               // ancho, margen exterior, margen interior de la tarjeta
  const TIT = '"Archivo Narrow", "Arial Narrow", sans-serif', TXT = '"IBM Plex Sans", system-ui, sans-serif';
  const C = { tinta: '#0E2230', suave: '#5A7183', linea: '#D9E6EF', fondo: '#F4F8FB', acento: '#29AAE3', oscuro: '#1583B5', naranja: '#B26A00', naranjaFondo: '#FFF3E0', verde: '#17865A' };
  const validos = d.calc.detalle.filter((l) => l.min);

  const dibujar = (ctx) => {
    const x0 = M, x1 = W - M, ix0 = x0 + IN, ix1 = x1 - IN;
    const txt = (t, x, y, font, color, align) => { ctx.font = font; ctx.fillStyle = color; ctx.textAlign = align || 'left'; ctx.fillText(t, x, y); };
    ctx.fillStyle = C.fondo; ctx.fillRect(0, 0, W, 99999);

    // Encabezado: logo y datos de la sesión
    let y = 56;
    if (logo) ctx.drawImage(logo, M, y, 330, 330 * logo.height / logo.width);
    txt('ASISTENCIA REMOTA', x1, y + 34, `700 34px ${TIT}`, C.oscuro, 'right');
    txt(d.fecha + (d.id ? '  ·  ' + d.id : ''), x1, y + 78, `500 28px ${TXT}`, C.suave, 'right');
    y += 330 * (logo ? logo.height / logo.width : 0.4) + 44;

    // Tarjeta blanca
    const yTarjeta = y;
    ctx.save();
    ctx.shadowColor = 'rgba(14,34,48,.08)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 6;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.roundRect(x0, yTarjeta, x1 - x0, ctx._alto || 900, 24); ctx.fill();
    ctx.restore();
    ctx.fillStyle = C.acento; ctx.beginPath(); ctx.roundRect(x0, yTarjeta, x1 - x0, 10, [24, 24, 0, 0]); ctx.fill();

    y += 76;
    txt('Cliente', ix0, y, `500 26px ${TXT}`, C.suave);
    y += 48;
    txt(d.cliente || '—', ix0, y, `700 44px ${TIT}`, C.tinta);

    const separador = () => { y += 40; ctx.fillStyle = C.linea; ctx.fillRect(ix0, y, ix1 - ix0, 2); y += 58; };
    separador();

    txt(validos.length > 1 ? 'Lapsos de conexión' : 'Lapso de conexión', ix0, y, `500 26px ${TXT}`, C.suave);
    validos.forEach((l) => {
      y += 56;
      txt(`De ${horaCorta(l.desde)} a ${horaCorta(l.hasta)} hs`, ix0, y, `500 32px ${TXT}`, C.tinta);
      let xd = ix1;
      txt(`${hhmm(l.min)} hs`, xd, y, `600 32px ${TXT}`, C.tinta, 'right');
      if (l.minFuera) {
        ctx.font = `600 32px ${TXT}`; xd -= ctx.measureText(`${hhmm(l.min)} hs`).width + 18;
        const etiqueta = (l.minFuera < l.min ? hhmm(l.minFuera) + ' hs ' : '') + '+50%';
        ctx.font = `700 22px ${TXT}`; const w = ctx.measureText(etiqueta).width + 24;
        ctx.fillStyle = C.naranjaFondo; ctx.beginPath(); ctx.roundRect(xd - w, y - 29, w, 38, 19); ctx.fill();
        txt(etiqueta, xd - w / 2, y - 3, `700 22px ${TXT}`, C.naranja, 'center');
      }
    });
    separador();

    const renglon = (izq, der, color) => {
      txt(izq, ix0, y, `400 30px ${TXT}`, color || C.tinta);
      txt(der, ix1, y, `600 30px ${TXT}`, color || C.tinta, 'right');
      y += 54;
    };
    renglon('Tiempo total', `${hhmm(d.calc.minutos)} hs`);
    renglon(`Subtotal (${factor(d.calc.unidades)} x ${pesos(d.valorHora)})`, pesos(d.calc.subtotal));
    if (d.calc.recargo) renglon(`Recargo fuera de horario (${textoRecargo(d.calc)})`, pesos(d.calc.recargo), C.naranja);

    // Total
    y += 6;
    const hTotal = 118;
    ctx.fillStyle = '#E3F3FB'; ctx.beginPath(); ctx.roundRect(ix0 - 16, y, ix1 - ix0 + 32, hTotal, 16); ctx.fill();
    txt('Total', ix0 + 12, y + 74, `700 36px ${TIT}`, C.tinta);
    txt(pesos(d.calc.total), ix1 - 12, y + 80, `700 62px ${TIT}`, C.tinta, 'right');
    y += hTotal;
    if (d.cobrada) {
      y += 50;
      txt('✓ Pagado' + (d.medio ? ' · ' + d.medio : ''), ix0, y, `600 28px ${TXT}`, C.verde);
    }

    if (d.detalle) {
      separador();
      txt('Trabajo realizado', ix0, y, `500 26px ${TXT}`, C.suave);
      ctx.font = `400 29px ${TXT}`;
      partirTexto(ctx, d.detalle, ix1 - ix0).forEach((linea) => { y += 44; txt(linea, ix0, y, `400 29px ${TXT}`, C.tinta); });
    }
    y += 60;
    const altoTarjeta = y - yTarjeta;

    // Pie
    y += 56;
    txt(`WhatsApp ${CONFIG.whatsapp || ''}  ·  ${CONFIG.web || ''}`, W / 2, y, `500 27px ${TXT}`, C.tinta, 'center');
    // El horario puede ser largo (varios tramos): se parte en renglones
    const pie = `Horario: ${textoHorario(false)}. Fuera de ese horario, ${ajNum('remoto_recargo')}% de recargo.`;
    ctx.font = `400 23px ${TXT}`;
    partirTexto(ctx, pie, W - 2 * M).forEach((l, i) => { y += i ? 32 : 44; txt(l, W / 2, y, `400 23px ${TXT}`, C.suave, 'center'); });
    y += 56;
    return { alto: y, altoTarjeta };
  };

  // Primera pasada para medir, segunda para dibujar con el alto justo
  const prueba = document.createElement('canvas'); prueba.width = W; prueba.height = 4000;
  const med = dibujar(prueba.getContext('2d'));
  const lienzo = document.createElement('canvas'); lienzo.width = W; lienzo.height = Math.ceil(med.alto);
  const ctx = lienzo.getContext('2d'); ctx._alto = med.altoTarjeta;
  dibujar(ctx);
  return lienzo;
}

function mensajeRemoto(calc, valorHora) {
  const validos = calc.detalle.filter((l) => l.min);
  const lista = validos.map((l) => `De ${horaCorta(l.desde)} a ${horaCorta(l.hasta)} hs`).join('\n');
  return `📡 *Asistencia Técnica Remota* 💻\n\n` +
    `*${validos.length > 1 ? 'Lapsos' : 'Lapso'} de Conexión:*\n${lista || 'De 0:00 a 0:00 hs'}\n\n` +
    `*Tiempo:* ${hhmm(calc.minutos)} hs\n\n` +
    `*Subtotal:* ${factor(calc.unidades)} x ${pesos(valorHora)}\n\n` +
    (calc.recargo ? `*Recargo fuera de horario (${textoRecargo(calc)}):* ${pesos(calc.recargo)}\n\n` : '') +
    `*Total:* ${pesos(calc.total)}`;
}

}

    lista = ordenarLista(lista, 'remoto');
    $('rmContador').textContent = `${lista.length} ${pl(lista.length, 'asistencia', 'asistencias')}`;
    pintarListado('rmLista', 'remoto', lista, tarjetaRemota, tablaRemotas, '<div class="vacio">No hay asistencias remotas con ese filtro.</div>');
  };
  $('rmBuscar').addEventListener('input', (e) => { busquedaRemoto = e.target.value; pintar(); });
  $('rmFiltro').addEventListener('change', (e) => {
    filtroRemoto = e.target.value;
    rutaActual = '#remoto/' + filtroRemoto;
    history.replaceState(null, '', rutaActual);
    pintar();
  });

  // Lleva derecho al bloque de Configuración, abierto y listo para escribir
  $('btnValorHora').onclick = () => irAConfig('remota', 'valor_hora');
  conectarSelectorVista('remoto', pintar);
  conectarOrden('remoto', pintar);
  pintar();
}

function vistaRemotaForm(id, clienteId) {
  const r = id ? DB.remotas.find((x) => x.id === id) : null;
  if (id && !r) {
    $('contenido').innerHTML = `<a class="volver" href="#remoto">${ICONO.atras} Remoto</a><div class="vacio">No encontré esa asistencia. Probá actualizar los datos.</div>`;
    return;
  }
  const esNueva = !r;
  const desdeCita = esNueva && preRemota ? preRemota : null;
  preRemota = null;
  let lapsos = r ? leerLapsos(r.lapsos) : [];
  if (desdeCita) lapsos = [{ desde: desdeCita.desde, hasta: desdeCita.hasta }];
  if (!lapsos.length) lapsos = [{ desde: '', hasta: '' }];
  let elegido = r
    ? (DB.clientes.find((c) => c.id === r.cliente_id) || { id: r.cliente_id, nombre: r.cliente, telefono: r.telefono })
    : (clienteId || (desdeCita && desdeCita.clienteId) ? DB.clientes.find((c) => c.id === (clienteId || desdeCita.clienteId)) : null) || null;
  let modo = esNueva && !elegido && !DB.clientes.length ? 'nuevo' : 'existente';
  const cobradaInicial = !!r && num(r.total) > 0 && num(r.cobrado) >= num(r.total);
  let cobrada = cobradaInicial;

  $('contenido').innerHTML = `
    <div class="angosto">
      <a class="volver" href="#remoto">${ICONO.atras} Remoto</a>
      ${esNueva ? '<h1>Nueva asistencia</h1><p class="bajada">Cargá los lapsos de conexión: el tiempo y el total se calculan solos.</p>'
        : `<div class="ot-num">${esc(r.id)}</div><p class="bajada">Cargada el ${esc(r.creado)}</p>`}

      <form id="formRemota" novalidate>
        <section class="bloque neutro">
          <h2>Cliente</h2>
          ${esNueva ? `
          <div class="segmento" role="group" aria-label="Tipo de cliente" id="rmModoSel">
            <button type="button" data-modo="existente" aria-pressed="${modo === 'existente'}">Ya es cliente</button>
            <button type="button" data-modo="nuevo" aria-pressed="${modo === 'nuevo'}">Nuevo</button>
          </div>
          <div id="rmExistente" ${modo === 'existente' ? '' : 'hidden'}>
            <div class="campo" id="rmBuscador" ${elegido ? 'hidden' : ''}>
              <label for="rmCliBuscar">Buscar por nombre o teléfono</label>
              <input type="search" id="rmCliBuscar" autocomplete="off" placeholder="Escribí al menos 2 letras o números">
              <ul class="resultados" id="rmResultados"></ul>
            </div>
            <div class="elegido" id="rmElegido" ${elegido ? '' : 'hidden'}>
              <div><strong id="rmElegidoNombre">${esc(elegido ? elegido.nombre : '')}</strong><br><small id="rmElegidoTel">${esc(elegido ? mostrarTel(elegido.telefono) : '')}</small></div>
              <button type="button" id="rmCambiar">Cambiar</button>
            </div>
          </div>
          <div id="rmNuevo" ${modo === 'nuevo' ? '' : 'hidden'}>
            <div class="campo"><label for="rmNombre">Nombre y apellido</label><input type="text" id="rmNombre" autocomplete="off"></div>
            ${campoTelefono('rmTelefono', 'Teléfono', '')}
            ${chipsOrigen('rmOrigen')}
          </div>` : `
          <a class="enlace-cliente" href="#cliente/${encodeURIComponent(r.cliente_id)}"><strong>${esc(r.cliente)}</strong><span>${esc(mostrarTel(r.telefono))}</span></a>`}
        </section>

        <section class="bloque">
          <h2>Conexión</h2>
          <div class="fila">
            <div class="campo"><label for="rmFecha">Fecha</label><input type="date" id="rmFecha" value="${aISO(r ? r.fecha : (desdeCita ? desdeCita.fecha : hoyTexto()))}"></div>
            <div class="campo"><label for="rmValor">Valor de la hora</label><input type="text" inputmode="numeric" id="rmValor" value="${esc(r ? r.valor_hora : valorHoraActual())}"></div>
          </div>
          <span class="etiqueta">Lapsos de conexión</span>
          <div id="rmLapsos" style="margin-top:8px"></div>
          <button class="btn btn-secundario btn-agregar" type="button" id="rmAgregar">Agregar otro lapso</button>
          ${r && r.evento_url ? `<a class="btn btn-secundario btn-auto" style="margin-top:10px" href="${esc(r.evento_url)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg> Ver en Google Calendar</a>` : ''}
        </section>

        <section class="bloque">
          <h2>Resultado</h2>
          <div class="cifras" id="rmResumen"></div>
        </section>

        <section class="bloque neutro">
          <h2>Mensaje para WhatsApp ${tip('En el celular, &quot;Enviar resumen&quot; comparte la imagen junto con el texto. En la compu copia la imagen y abre el chat del cliente: pegala ahí.')}</h2>
          <pre class="mensaje-wa" id="rmMensaje"></pre>
          ${botoneraImagen('rm', 'Enviar resumen')}
          <div class="botones-fila" style="margin-top:8px">
            <a class="btn btn-secundario" id="rmWhatsapp" target="_blank" rel="noopener">${ICONO.wa} Enviar solo el texto</a>
            <button class="btn btn-secundario" type="button" id="rmCopiarTexto">${ICONO.texto} Copiar mensaje</button>
          </div>
        </section>

        <section class="bloque neutro">
          <h2>Trabajo y cobro</h2>
          <div class="campo"><label for="rmDetalle">Qué se hizo <span class="opcional">(opcional)</span></label><textarea id="rmDetalle" placeholder="Ej.: configuración de impresora y limpieza de inicio.">${esc(r ? r.detalle : (desdeCita ? desdeCita.detalle : ''))}</textarea></div>
          <span class="etiqueta">Cobrado</span>
          <div class="segmento" role="group" aria-label="Cobrado" id="rmCobradoSel" style="margin-top:6px">
            <button type="button" data-cobrado="si" aria-pressed="${cobradaInicial}">Sí</button>
            <button type="button" data-cobrado="no" aria-pressed="${!cobradaInicial}">No</button>
          </div>
          <div id="rmMedioCampo" ${cobradaInicial ? '' : 'hidden'}>
            ${campoSelect('medio_pago', 'Medio de pago', r ? r.medio_pago : '', MEDIOS).replace('id="f_medio_pago" name="medio_pago"', 'id="rmMedio"').replace('for="f_medio_pago"', 'for="rmMedio"')}
          </div>
        </section>

        <div class="mensaje error" id="errorRemota" role="alert" hidden></div>
        ${esNueva ? '<button class="btn btn-principal" type="submit" id="rmGuardar">Guardar asistencia</button>' : ''}
      </form>
    </div>`;

  const form = $('formRemota');
  const valorHora = () => Number(parsePlata($('rmValor').value)) || 0;
  const telefonoActual = () => modo === 'nuevo' ? leerTelefono('rmTelefono') : (elegido ? elegido.telefono : '');
  const error = (msg) => { $('errorRemota').textContent = msg; $('errorRemota').hidden = !msg; };

  const pintarLapsos = () => {
    $('rmLapsos').innerHTML = lapsos.map((l, i) => `
      <div class="lapso" data-i="${i}">
        <div class="campo"><label for="rmDesde${i}">Desde</label><input type="text" class="hora" inputmode="numeric" maxlength="5" placeholder="13:10" autocomplete="off" id="rmDesde${i}" data-campo="desde" value="${esc(horaCorta(l.desde))}"></div>
        <div class="campo"><label for="rmHasta${i}">Hasta</label><input type="text" class="hora" inputmode="numeric" maxlength="5" placeholder="13:45" autocomplete="off" id="rmHasta${i}" data-campo="hasta" value="${esc(horaCorta(l.hasta))}"></div>
        <div class="lapso-dur" id="rmDur${i}"></div>
        <button type="button" class="lapso-quitar" data-quitar="${i}" aria-label="Quitar este lapso" ${lapsos.length === 1 ? 'disabled' : ''}>×</button>
      </div>`).join('');
  };

  const actualizar = () => {
    const vh = valorHora();
    const calc = calcularRemota(lapsos, vh, deISO($('rmFecha').value));
    calc.detalle.forEach((l, i) => {
      const el = $('rmDur' + i);
      if (!el) return;
      const conRecargo = l.min !== null && l.minFuera > 0;
      el.innerHTML = l.min === null ? '—' : `${hhmm(l.min)} hs${conRecargo ? `<small>${l.minFuera < l.min ? hhmm(l.minFuera) + ' ' : ''}+50%</small>` : ''}`;
      el.classList.toggle('ok', l.min !== null);
      el.classList.toggle('fuera', conRecargo);
      el.title = conRecargo ? `${hhmm(l.minFuera)} hs fuera del horario: llevan 50% de recargo` : '';
    });
    $('rmResumen').innerHTML = `
      <div class="cifra"><span class="cifra-valor">${hhmm(calc.minutos)} hs</span><span class="cifra-nombre">Tiempo total</span></div>
      <div class="cifra"><span class="cifra-valor">${esc(factor(calc.unidades))} x ${esc(pesos(vh))}</span><span class="cifra-nombre">Subtotal</span></div>
      ${calc.recargo ? `<div class="cifra" style="grid-column:1/-1"><span class="cifra-valor">${esc(pesos(calc.recargo))}</span><span class="cifra-nombre">Recargo fuera de horario (${esc(textoRecargo(calc))})</span></div>` : ''}
      <div class="cifra total"><span class="cifra-valor">${esc(pesos(calc.total))}</span><span class="cifra-nombre">Total</span></div>`;
    const msg = mensajeRemoto(calc, vh);
    $('rmMensaje').textContent = msg;
    const tel = telefonoActual();
    const wa = $('rmWhatsapp');
    if (telWa(tel).length >= 8) { wa.href = linkWa(tel, msg); wa.removeAttribute('aria-disabled'); wa.style.opacity = ''; }
    else { wa.removeAttribute('href'); wa.setAttribute('aria-disabled', 'true'); wa.style.opacity = '.5'; }
    return { calc, msg, vh };
  };

  pintarLapsos();
  actualizar();

  const tocar = () => marcarSucio(true, !esNueva);
  $('rmLapsos').addEventListener('input', (e) => {
    const fila = e.target.closest('.lapso');
    if (!fila || !e.target.dataset.campo) return;
    const el = e.target;
    const formateado = formatearHora(el.value);
    if (formateado !== el.value) el.value = formateado;
    el.classList.remove('invalida');
    lapsos[Number(fila.dataset.i)][el.dataset.campo] = el.value;
    actualizar();
  });
  $('rmLapsos').addEventListener('focusout', (e) => {
    const el = e.target;
    if (!el.dataset || !el.dataset.campo) return;
    el.classList.toggle('invalida', !!el.value && aMinutos(el.value) === null);
  });
  $('rmLapsos').addEventListener('click', (e) => {
    const b = e.target.closest('[data-quitar]');
    if (!b || lapsos.length === 1) return;
    lapsos.splice(Number(b.dataset.quitar), 1);
    pintarLapsos(); actualizar(); tocar();
  });
  $('rmAgregar').onclick = () => {
    lapsos.push({ desde: '', hasta: '' });
    pintarLapsos(); actualizar(); tocar();
    $('rmDesde' + (lapsos.length - 1)).focus();
  };
  form.addEventListener('input', () => { tocar(); actualizar(); });
  form.addEventListener('change', tocar);

  $('rmCobradoSel').addEventListener('click', (e) => {
    const b = e.target.closest('[data-cobrado]');
    if (!b) return;
    cobrada = b.dataset.cobrado === 'si';
    $('rmCobradoSel').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    $('rmMedioCampo').hidden = !cobrada;
    tocar();
  });
  $('rmCopiarTexto').onclick = async () => {
    const msg = actualizar().msg;
    try { await navigator.clipboard.writeText(msg); avisar('Mensaje copiado'); }
    catch (e) {
      const t = document.createElement('textarea');
      t.value = msg; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); avisar('Mensaje copiado'); } catch (e2) { avisar('No se pudo copiar. Seleccioná el texto a mano.', true); }
      t.remove();
    }
  };
  conectarBotonesImagen('rm', {
    lienzo: async () => {
      const { calc, vh } = actualizar();
      if (!calc.minutos) throw new Error('Cargá al menos un lapso de conexión.');
      const cliente = modo === 'nuevo' ? $('rmNombre').value.trim() : (elegido ? elegido.nombre : '');
      return imagenRemota({
        id: r ? r.id : '', fecha: deISO($('rmFecha').value), cliente, calc, valorHora: vh,
        detalle: $('rmDetalle').value.trim(), cobrada, medio: cobrada ? $('rmMedio').value : ''
      });
    },
    nombre: () => `Asistencia remota ${r ? r.id + ' ' : ''}${deISO($('rmFecha').value).replace(/\//g, '-')}.jpg`,
    texto: () => actualizar().msg,
    telefono: telefonoActual
  });

  $('rmWhatsapp').addEventListener('click', (e) => {
    if (!$('rmWhatsapp').getAttribute('href')) { e.preventDefault(); avisar('Falta el teléfono del cliente. Podés usar "Copiar mensaje".', true); }
  });

  if (esNueva) {
    const cambiarModo = (m) => {
      modo = m;
      $('rmModoSel').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.modo === m)));
      $('rmExistente').hidden = m !== 'existente';
      $('rmNuevo').hidden = m !== 'nuevo';
      actualizar();
    };
    const elegir = (c) => {
      elegido = c;
      $('rmElegidoNombre').textContent = c.nombre;
      $('rmElegidoTel').textContent = mostrarTel(c.telefono);
      $('rmElegido').hidden = false;
      $('rmBuscador').hidden = true;
      $('rmResultados').innerHTML = '';
      actualizar();
    };
    $('rmModoSel').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => cambiarModo(b.dataset.modo)));
    $('rmCambiar').onclick = () => { elegido = null; $('rmElegido').hidden = true; $('rmBuscador').hidden = false; $('rmCliBuscar').value = ''; $('rmCliBuscar').focus(); actualizar(); };
    $('rmCliBuscar').addEventListener('input', () => {
      const q = normalizar($('rmCliBuscar').value.trim());
      const qd = digitos(q);
      const ul = $('rmResultados');
      ul.innerHTML = '';
      if (q.length < 2) return;
      const res = DB.clientes.filter((c) => normalizar(c.nombre).includes(q) || (qd.length >= 3 && digitos(c.telefono).includes(qd))).slice(0, 12);
      if (!res.length) { ul.innerHTML = '<li><button type="button" disabled>Sin resultados. Cargalo como cliente nuevo.</button></li>'; return; }
      res.forEach((c) => {
        const li = document.createElement('li');
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = esc(c.nombre) + '<small>' + esc(mostrarTel(c.telefono)) + '</small>';
        b.onclick = () => elegir(c);
        li.appendChild(b);
        ul.appendChild(li);
      });
    });
  }

  // Valida y arma los datos a guardar
  const juntar = () => {
    const completos = lapsos.filter((l) => l.desde && l.hasta);
    if (lapsos.some((l) => (l.desde && !l.hasta) || (!l.desde && l.hasta))) throw new Error('Hay un lapso con solo una de las dos horas. Completalo o quitalo.');
    if (lapsos.some((l) => (l.desde && aMinutos(l.desde) === null) || (l.hasta && aMinutos(l.hasta) === null))) throw new Error('Hay una hora mal escrita. Usá el formato 24 hs, por ejemplo 13:10.');
    if (!completos.length) throw new Error('Cargá al menos un lapso de conexión.');
    const calc = calcularRemota(completos, valorHora(), deISO($('rmFecha').value));
    if (calc.detalle.some((l) => l.min === 0)) throw new Error('Hay un lapso que empieza y termina a la misma hora.');
    if (!valorHora()) throw new Error('Poné el valor de la hora.');
    const cobrado = cobrada ? String(calc.total) : '';
    const fecha = deISO($('rmFecha').value);
    if (!fecha) throw new Error('Poné la fecha.');
    return {
      fecha,
      lapsos: completos.map((l) => `${normalizarHora(l.desde)}-${normalizarHora(l.hasta)}`).join('; '),
      valor_hora: String(valorHora()),
      detalle: $('rmDetalle').value.trim(),
      cobrado,
      medio_pago: cobrada ? $('rmMedio').value : '',
      _calc: calc
    };
  };

  if (esNueva) {
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      error('');
      let datos;
      try {
        datos = juntar();
        if (modo === 'existente' && !elegido) throw new Error('Elegí el cliente de la lista.');
        if (modo === 'nuevo' && !$('rmNombre').value.trim()) throw new Error('Falta el nombre del cliente.');
        if (modo === 'nuevo' && numeroTelefono('rmTelefono').length < 6) throw new Error('Falta el teléfono del cliente (al menos 6 números, sin el código de país).');
      } catch (e) { return error(e.message); }
      delete datos._calc;
      datos.cliente = modo === 'existente'
        ? { modo: 'existente', id: elegido.id }
        : { modo: 'nuevo', nombre: $('rmNombre').value.trim(), telefono: leerTelefono('rmTelefono'), origen: leerChipsOrigen('rmOrigen') };

      const b = $('rmGuardar');
      b.disabled = true; b.textContent = 'Guardando…';
      const conocidas = new Set(DB.remotas.map((x) => x.id));
      const listo = (remota, cliente) => {
        if (cliente) reemplazar(DB.clientes, 'id', cliente);
        reemplazar(DB.remotas, 'id', remota);
        // si venía de una cita agendada, queda marcada como realizada
        if (desdeCita && desdeCita.citaId) {
          const cita = DB.citas.find((x) => x.id === desdeCita.citaId);
          if (cita) reemplazar(DB.citas, 'id', { ...cita, estado: 'Realizada' });
          encolar({ clave: 'cita:' + desdeCita.citaId, accion: 'actualizarCita', datos: { id: desdeCita.citaId, cambios: { estado: 'Realizada' } }, alTerminar: (res) => reemplazar(DB.citas, 'id', res.cita) });
        }
        marcarSucio(false);
        avisar('Asistencia guardada');
        location.hash = '#remota/' + encodeURIComponent(remota.id);
      };
      try {
        const res = await api('crearRemota', { datos }, 25000);
        listo(res.remota, res.cliente);
      } catch (e) {
        if (!e.rechazado && !e.sesion) {
          b.textContent = 'Verificando en la planilla…';
          const tel = digitos(telefonoActual()).slice(-8);
          const x = await verificarCreacion(() => DB.remotas.find((y) =>
            !conocidas.has(y.id) && y.lapsos.replace(/\s/g, '') === datos.lapsos.replace(/\s/g, '') &&
            (datos.cliente.modo === 'existente' ? y.cliente_id === datos.cliente.id : digitos(y.telefono).slice(-8) === tel)));
          if (x) return listo(x);
          error('No pude confirmar si se guardó. Revisá la lista de Remoto antes de reintentar, para no duplicarla.');
        } else {
          error(e.message);
        }
        b.disabled = false; b.textContent = 'Guardar asistencia';
      }
    });
  } else {
    form.addEventListener('submit', (e) => { e.preventDefault(); if (guardarActual) guardarActual(); });
    guardarActual = async () => {
      error('');
      let datos;
      try { datos = juntar(); } catch (e) { error(e.message); avisar(e.message, true); return; }
      const calc = datos._calc;
      delete datos._calc;
      const cambios = diferencias(datos, r);
      if (!Object.keys(cambios).length) { marcarSucio(false); return; }
      reemplazar(DB.remotas, 'id', { ...r, ...cambios, minutos: String(calc.minutos), unidades: String(calc.unidades), recargo: calc.recargo ? String(calc.recargo) : '', total: String(calc.total), actualizado: ahoraTexto() });
      marcarSucio(false);
      avisar('Cambios guardados');
      refrescarVista();
      const destino = '#remota/' + encodeURIComponent(r.id);
      encolar({
        clave: 'remota:' + r.id,
        accion: 'actualizarRemota',
        datos: { id: r.id, cambios },
        alTerminar: (res) => {
          reemplazar(DB.remotas, 'id', res.remota);
          if (location.hash === destino && !sucio) refrescarVista();
        }
      });
    };
  }
}

/* ═════════ Comprobante ═════════ */
function armarComprobante(o) {
  const entrega = o.estado === 'Entregado';
  const devuelto = o.estado === 'Sin reparación';
  const titulo = entrega ? 'Comprobante de entrega' : devuelto ? 'Comprobante de devolución' : 'Comprobante de ingreso';
  const sec = (t, v) => v ? `<div class="cp-sec"><h4>${t}</h4><p>${esc(v)}</p></div>` : '';

  const cuerpo = (entrega || devuelto) ? `
    ${sec('Falla informada', o.falla)}
    ${sec('Diagnóstico', o.diagnostico)}
    ${sec('Trabajo realizado', o.trabajo_realizado)}
    ${entrega && num(o.presupuesto) ? `<div class="cp-sec"><h4>Importe</h4>
      <p class="cp-total">Total: ${plata(num(o.presupuesto))}</p>
      <p>Abonado: ${plata(num(o.cobrado))}${o.medio_pago ? ' (' + esc(o.medio_pago) + ')' : ''}</p>
      ${saldo(o) ? `<p><strong>Saldo pendiente: ${plata(saldo(o))}</strong></p>` : ''}</div>` : ''}
    ${entrega && o.garantia_hasta ? `<div class="cp-sec"><h4>Garantía</h4><p>Mano de obra garantizada hasta el ${esc(o.garantia_hasta)}. En repuestos, según el componente.</p></div>` : ''}
    ${sec('Accesorios devueltos', o.accesorios)}
    <div class="cp-firmas"><div>Recibí el equipo conforme: firma y aclaración</div><div>${esc(CONFIG.responsable)}</div></div>`
  : `
    ${sec('Falla que informa el cliente', o.falla)}
    <div class="cp-sec"><h4>Accesorios que deja</h4><p>${esc(o.accesorios) || 'Ninguno'}</p></div>
    <div class="cp-sec"><h4>Estado del equipo al ingresar</h4><p>${esc(o.estado_ingreso) || 'Sin observaciones visibles'}</p>${o.observaciones ? `<p>${esc(o.observaciones)}</p>` : ''}</div>
    ${linkSeguimiento(o) ? `<div class="cp-sec"><h4>Seguí el estado de tu equipo</h4><p>${esc(linkSeguimiento(o))}</p></div>` : ''}
    <div class="cp-cond"><strong>Condiciones</strong><ul>${(CONFIG.condiciones || []).map((c) => `<li>${esc(c)}</li>`).join('')}</ul><p>Al dejar el equipo aceptás los términos y condiciones del servicio: ${esc(location.origin)}/terminos</p></div>
    <div class="cp-firmas"><div>Firma y aclaración del cliente</div><div>${esc(CONFIG.responsable)}</div></div>`;

  $('comprobante').innerHTML = `
    <div class="cp-cab">
      <div>
        <h3>${esc(CONFIG.negocio)}</h3>
        <div>${esc(CONFIG.responsable)}</div>
        <div>WhatsApp ${esc(CONFIG.whatsapp)} · ${esc(CONFIG.email)} · ${esc(CONFIG.web)}</div>
      </div>
      <div class="cp-ot">${esc(o.numero)}<div class="cp-tipo">${titulo}</div></div>
    </div>
    <div class="cp-grid">
      <div><strong>Cliente:</strong> ${esc(o.cliente)}</div>
      <div><strong>Teléfono:</strong> ${esc(mostrarTel(o.telefono))}</div>
      <div><strong>Equipo:</strong> ${esc(descEquipo(o))}</div>
      <div><strong>N° de serie:</strong> ${esc(o.serie) || '—'}</div>
      <div><strong>Ingreso:</strong> ${esc(o.fecha_ingreso)}</div>
      ${(entrega || devuelto) && o.fecha_entrega ? `<div><strong>Entrega:</strong> ${esc(o.fecha_entrega)}</div>` : ''}
    </div>
    ${cuerpo}`;
}

/* ═════════ Cómo se escriben las horas y los importes ═════════
   Vale para toda la app: las horas quedan en 24 hs (HH:MM) y los importes
   con punto cada mil. Se hace acá una sola vez, para cualquier campo. */
const esHora = (el) => el && el.classList && el.classList.contains('hora');
const esPlata = (el) => el && el.classList && (el.dataset.tipo === 'plata' || el.classList.contains('item-p') || el.classList.contains('cat-precio'));
// En captura: el campo queda formateado antes de que cada vista lea lo que escribiste
document.addEventListener('input', (e) => {
  if (esHora(e.target)) e.target.value = formatearHora(e.target.value);
  else if (esPlata(e.target)) escribirPlata(e.target);
}, true);
document.addEventListener('blur', (e) => {
  if (!esHora(e.target)) return;
  const n = normalizarHora(e.target.value);   // "9:5" queda como estaba; "9:05" pasa a "09:05"
  if (n) e.target.value = n;
}, true);

/* ═════════ Inicio ═════════ */
(function iniciar() {
  if (typeof CONFIG === 'undefined') return mostrarLogin('No se encontró config.js. Subilo en la misma carpeta que index.html.');
  if (String(CONFIG.API_URL).startsWith('PEGAR')) return mostrarLogin('Falta pegar la URL de Apps Script en config.js.');
  if (!leerSesion()) return mostrarLogin();
  iniciarApp();
})();
</script>
